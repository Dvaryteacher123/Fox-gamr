<!-- index.html -->
<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone - Home</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Top Navbar -->
    <nav class="navbar">
        <div class="logo">GameZone</div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">🏠 Home</a></li>
            <li><a href="#games">🎮 Games</a></li>
            <li><a href="#community" id="nav-community">👥 Community</a></li>
            <li><a href="#vip">⭐ VIP</a></li>
            <li><a href="#notifications">🔔 Notifications <span id="notification-badge" class="badge">0</span></a></li>
            <li><a href="#profile" id="auth-link">👤 Profile</a></li>
        </ul>
    </nav>

    <div class="container">
        <!-- Sehemu ya Magame -->
        <section id="games" class="games-section">
            <h2>Magame Yanayopatikana</h2>
            <div id="games-container" class="grid-cards">
                <!-- Magame yatajazwa na JavaScript -->
            </div>
        </section>

        <!-- Sehemu ya Community Chat -->
        <section id="community" class="chat-section">
            <h2>👥 DVARY Community</h2>
            
            <!-- Ujumbe kama user hajalogin -->
            <div id="auth-warning" style="display: none; background: #1f1f1f; padding: 1.5rem; border-radius: 8px; text-align: center; border: 1px solid #333;">
                <p style="margin-bottom: 1rem; color: #ccc;">Tafadhali ingia kwenye account yako ili kujiunga na Community.</p>
                <a href="login.html" class="download-btn" style="display: inline-block; width: auto; padding: 0.5rem 1.5rem; margin-right: 0.5rem;">Login</a>
                <a href="signup.html" class="download-btn" style="display: inline-block; width: auto; padding: 0.5rem 1.5rem; background-color: #ff4757;">Register</a>
            </div>

            <!-- Sehemu kuu ya Chat (Itaonekana kama amelogin) -->
            <div id="chat-main-container">
                <p style="font-size: 0.85rem; color: #2ed573; margin-bottom: 0.5rem;">🟢 Online Status: Active</p>
                <div id="chat-box" class="chat-box">
                    <!-- Ujumbe utaingizwa hapa hapa -->
                </div>
                
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Andika ujumbe...">
                    <button id="send-btn">➤</button>
                </div>
            </div>
        </section>
    </div>

    <script src="assets/js/chat.js" type="module"></script>
</body>
</html>
