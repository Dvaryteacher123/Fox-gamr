                </div>
                <div class="input-group">
                    <label>Link 6 (Server 6)</label>
                    <input type="url" name="download-url" placeholder="https://...">
                </div>
                <div class="input-group">
                    <label>Link 7 (Server 7)</label>
                    <input type="url" name="download-url" placeholder="https://...">
                </div>

                <button type="submit" class="admin-btn">Chapisha Game (Publish)</button>
            </form>
        </main>
