<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVARY GAMES - Main</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>

    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121f;
            --bg-card: rgba(26, 26, 46, 0.7);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --accent-hover: #8b5cf6;
            --border: rgba(255, 255, 255, 0.06);
            --shadow: rgba(99, 102, 241, 0.15);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.06);
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
        }

        [data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.8);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.2);
            --accent-hover: #818cf8;
            --border: rgba(0, 0, 0, 0.06);
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(0, 0, 0, 0.06);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            padding-top: 72px;
            padding-bottom: 80px;
        }

        /* ============================================================
           SCROLLBAR
           ============================================================ */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 3px;
        }

        /* ============================================================
           TOP HEADER - STICKY
           ============================================================ */
        .top-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 12px 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .top-header.scrolled {
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .header-left .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .header-left .logo span {
            color: var(--accent);
        }

        .header-left .logo .icon {
            margin-right: 4px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-right .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .header-right .search-wrapper input {
            padding: 8px 14px 8px 36px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            width: 180px;
        }

        .header-right .search-wrapper input:focus {
            border-color: var(--accent);
            width: 220px;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .header-right .search-wrapper .search-icon {
            position: absolute;
            left: 12px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .header-right .search-wrapper input::placeholder {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .header-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            padding: 6px;
            border-radius: 50%;
        }

        .header-btn:hover {
            color: var(--text-primary);
            background: var(--glass-bg);
        }

        .header-btn .badge {
            position: absolute;
            top: 0;
            right: 0;
            width: 18px;
            height: 18px;
            background: var(--danger);
            color: white;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-btn .badge.hidden {
            display: none;
        }

        /* ============================================================
           MENU BAR - Free & VIP ONLY
           ============================================================ */
        .menu-bar {
            position: fixed;
            top: 72px;
            left: 0;
            right: 0;
            z-index: 99;
            padding: 12px 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            transition: all 0.3s ease;
        }

        .menu-bar .menu-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 30px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .menu-bar .menu-btn:hover {
            color: var(--text-primary);
            background: var(--glass-bg);
        }

        .menu-bar .menu-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 30px var(--accent-glow);
        }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 20px 100px;
        }

        .section-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 18px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title span {
            color: var(--accent);
        }

        .section-title .see-all {
            margin-left: auto;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.3s;
        }

        .section-title .see-all:hover {
            color: var(--accent);
        }

        /* ============================================================
           GAME CARDS
           ============================================================ */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 40px;
        }

        .game-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 15px 50px var(--shadow);
        }

        .game-card .card-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            position: relative;
            overflow: hidden;
        }

        .game-card .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .game-card:hover .card-image img {
            transform: scale(1.05);
        }

        .game-card .card-image .card-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 2;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .badge-free {
            background: var(--success);
            color: white;
        }

        .badge-vip {
            background: var(--warning);
            color: white;
        }

        .badge-premium {
            background: var(--accent);
            color: white;
        }

        .badge-price {
            background: var(--info);
            color: white;
        }

        .badge-unlocked {
            background: var(--success);
            color: white;
        }

        .game-card .card-body {
            padding: 18px 20px 12px;
            flex: 1;
        }

        .game-card .card-body .name {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .game-card .card-body .genre {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .game-card .card-body .price-tag {
            font-size: 16px;
            font-weight: 700;
            color: var(--warning);
            margin-top: 4px;
        }

        .game-card .card-body .price-tag.free {
            color: var(--success);
        }

        .game-card .card-body .screenshot-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .game-card .card-body .screenshot-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.03);
        }

        /* Screenshot Modal */
        .screenshot-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: modalFade 0.3s ease;
        }

        .screenshot-modal.active {
            display: flex;
        }

        @keyframes modalFade {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .screenshot-modal .modal-content {
            max-width: 90vw;
            max-height: 90vh;
            background: var(--bg-secondary);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
        }

        .screenshot-modal .modal-content img {
            width: 100%;
            height: auto;
            max-height: 80vh;
            object-fit: contain;
            display: block;
        }

        .screenshot-modal .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            font-size: 28px;
            cursor: pointer;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .screenshot-modal .modal-close:hover {
            background: var(--danger);
            transform: scale(1.1);
        }

        .screenshot-modal .modal-download {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .screenshot-modal .modal-download:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.3);
        }

        .screenshot-modal .modal-info {
            padding: 16px 20px;
            background: var(--bg-primary);
            border-top: 1px solid var(--border);
        }

        .screenshot-modal .modal-info h3 {
            color: var(--text-primary);
            font-size: 18px;
        }

        .screenshot-modal .modal-info p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ============================================================
           GAME CARD FOOTER - CLAIM & DOWNLOAD
           ============================================================ */
        .game-card .card-footer {
            padding: 12px 20px 18px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .game-card .card-footer .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--success), #16a34a);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            width: 100%;
            animation: pulseGreen 2s infinite;
        }

        @keyframes pulseGreen {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
            }
            50% {
                box-shadow: 0 0 40px rgba(34, 197, 94, 0.6);
            }
        }

        .game-card .card-footer .download-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 60px rgba(34, 197, 94, 0.4);
        }

        .game-card .card-footer .download-btn .arrow {
            font-size: 20px;
            transition: transform 0.3s ease;
        }

        .game-card .card-footer .download-btn:hover .arrow {
            transform: translateY(3px);
        }

        .game-card .card-footer .game-size {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
        }

        .game-card .card-footer .download-links-small {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }

        .game-card .card-footer .download-links-small .dl-link {
            font-size: 12px;
            background: var(--glass-bg);
            padding: 4px 14px;
            border-radius: 12px;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .game-card .card-footer .download-links-small .dl-link:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .game-card .card-footer .no-links {
            color: var(--text-secondary);
            font-size: 13px;
            text-align: center;
        }

        /* ============================================================
           CLAIM SECTION
           ============================================================ */
        .game-card .card-footer .claim-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
        }

        .game-card .card-footer .claim-section .claim-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-decoration: none;
        }

        .game-card .card-footer .claim-section .claim-btn.claim-toggle {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
        }

        .game-card .card-footer .claim-section .claim-btn.claim-toggle:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .game-card .card-footer .claim-section .claim-btn .icon {
            font-size: 18px;
        }

        .game-card .card-footer .claim-input-group {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 4px;
        }

        .game-card .card-footer .claim-input-group input {
            flex: 1;
            padding: 10px 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: monospace;
            outline: none;
            transition: border-color 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .game-card .card-footer .claim-input-group input:focus {
            border-color: var(--accent);
        }

        .game-card .card-footer .claim-input-group input::placeholder {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .game-card .card-footer .claim-input-group .claim-submit {
            padding: 10px 18px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .game-card .card-footer .claim-input-group .claim-submit:hover {
            transform: scale(1.05);
        }

        .game-card .card-footer .claim-input-group .claim-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .game-card .card-footer .status-msg {
            display: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            margin-top: 4px;
        }

        .game-card .card-footer .status-msg.success {
            display: block;
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .game-card .card-footer .status-msg.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .game-card .card-footer .status-msg.info {
            display: block;
            background: rgba(59, 130, 246, 0.15);
            color: var(--info);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        /* ============================================================
           LOADING
           ============================================================ */
        .loading-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            aspect-ratio: 16 / 9;
            animation: pulse 1.5s ease-in-out infinite;
            min-height: 280px;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 0.6;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* ============================================================
           NOTIFICATION TOAST
           ============================================================ */
        .notification-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            animation: slideIn 0.5s ease;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .notification-toast.success {
            background: var(--success);
        }
        .notification-toast.error {
            background: var(--danger);
        }
        .notification-toast.info {
            background: var(--accent);
        }
        .notification-toast.warning {
            background: var(--warning);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .notification-toast .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            margin-left: 15px;
            opacity: 0.7;
        }

        .notification-toast .close-btn:hover {
            opacity: 1;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 1024px) {
            .games-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding-top: 64px;
                padding-bottom: 70px;
            }

            .top-header {
                padding: 10px 16px;
            }
            .header-left .logo {
                font-size: 18px;
            }

            .header-right .search-wrapper input {
                width: 120px;
                font-size: 13px;
                padding: 6px 10px 6px 32px;
            }
            .header-right .search-wrapper input:focus {
                width: 150px;
            }
            .header-right .search-wrapper .search-icon {
                font-size: 12px;
                left: 10px;
            }

            .menu-bar {
                top: 60px;
                padding: 10px 16px;
                gap: 6px;
                overflow-x: auto;
                flex-wrap: nowrap;
                scrollbar-width: none;
            }
            .menu-bar::-webkit-scrollbar {
                display: none;
            }
            .menu-bar .menu-btn {
                font-size: 13px;
                padding: 6px 14px;
                white-space: nowrap;
            }

            .main-content {
                padding: 16px 16px 90px;
            }
            .section-title {
                font-size: 20px;
            }

            .games-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .game-card .card-image {
                aspect-ratio: 16 / 9;
                font-size: 48px;
            }
            .game-card .card-body .name {
                font-size: 20px;
            }
            .game-card .card-body .genre {
                font-size: 14px;
            }

            .game-card .card-footer .download-btn {
                font-size: 16px;
                padding: 14px 20px;
            }

            .game-card .card-footer .claim-input-group {
                flex-wrap: wrap;
            }
            .game-card .card-footer .claim-input-group input {
                min-width: 120px;
            }

            .screenshot-modal .modal-content {
                max-width: 95vw;
            }

            .screenshot-modal .modal-download {
                bottom: 10px;
                right: 10px;
                padding: 10px 18px;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .game-card .card-image {
                aspect-ratio: 16 / 9;
                font-size: 40px;
            }
            .game-card .card-body {
                padding: 14px 16px 10px;
            }
            .game-card .card-body .name {
                font-size: 18px;
            }
            .game-card .card-body .genre {
                font-size: 13px;
            }
            .game-card .card-footer {
                padding: 10px 16px 14px;
            }
            .game-card .card-footer .download-btn {
                font-size: 15px;
                padding: 12px 16px;
            }

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCnaIWkHEwoWQgjadYLyfVoMWZK0x6toxA",
            authDomain: "enjoy-game-6c05c.firebaseapp.com",
            projectId: "enjoy-game-6c05c",
            storageBucket: "enjoy-game-6c05c.firebasestorage.app",
            messagingSenderId: "512924203714",
            appId: "1:512924203714:web:47b16f7ce1b786a224195b",
            measurementId: "G-Y2H8BYM4LP"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ============================================================
        // STATE
        // ============================================================
        let allGames = [];
        let currentUser = null;
        let currentUserEmail = null;
        let notifications = [];
        let unlockedGames = new Set();
        let currentTab = 'free';

        // ============================================================
        // AUTH STATE
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                currentUserEmail = user.email;
                console.log(`✅ User logged in: ${currentUserEmail}`);
                await loadUnlockedGames();
                loadGames();
                loadNotifications();
            } else {
                console.log('🔒 User not logged in, redirecting to login...');
                const main = document.getElementById('mainContent');
                main.innerHTML = `
                    <div style="text-align:center;padding:80px 20px;">
                        <div style="font-size:64px;margin-bottom:20px;">🔒</div>
                        <h2 style="color:var(--text-primary);font-size:28px;margin-bottom:10px;">Please Login</h2>
                        <p style="color:var(--text-secondary);margin-bottom:20px;">You need to be logged in to access this page.</p>
                        <a href="/login" style="display:inline-block;padding:14px 40px;background:var(--accent);color:white;border-radius:12px;text-decoration:none;font-weight:600;">🔑 Login</a>
                    </div>
                `;
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            }
        });

        // ============================================================
        // LOAD UNLOCKED GAMES
        // ============================================================
        async function loadUnlockedGames() {
            if (!currentUser) return;
            try {
                const snapshot = await db.collection('users')
                    .doc(currentUser.uid)
                    .collection('unlockedGames')
                    .get();
                unlockedGames.clear();
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.unlocked === true && data.gameId) {
                        unlockedGames.add(data.gameId);
                    }
                });
                console.log(`✅ Loaded ${unlockedGames.size} unlocked games`);
            } catch (error) {
                console.error('Error loading unlocked games:', error);
            }
        }

        // ============================================================
        // UNLOCK GAME
        // ============================================================
        async function unlockGameForUser(gameId, gameName, downloadLink) {
            if (!currentUser) return false;
            try {
                await db.collection('users')
                    .doc(currentUser.uid)
                    .collection('unlockedGames')
                    .doc(gameId)
                    .set({
                        unlocked: true,
                        gameId: gameId,
                        gameName: gameName,
                        downloadLink: downloadLink,
                        unlockedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        unlockedByEmail: currentUser.email
                    });
                unlockedGames.add(gameId);
                return true;
            } catch (error) {
                console.error('Error unlocking game:', error);
                return false;
            }
        }

        function isGameUnlocked(gameId) {
            return unlockedGames.has(gameId);
        }

        // ============================================================
        // LOAD GAMES
        // ============================================================
        async function loadGames() {
            try {
                const snapshot = await db.collection('games')
                    .orderBy('createdAt', 'desc')
                    .get();

                const tempGames = [];
                const seenNames = new Set();

                snapshot.forEach((doc) => {
                    const game = doc.data();
                    game.id = doc.id;
                    const name = (game.name || '').toLowerCase().trim();
                    if (name && !seenNames.has(name)) {
                        seenNames.add(name);
                        tempGames.push(game);
                    }
                });

                allGames = tempGames;
                console.log(`✅ Loaded ${allGames.length} unique games`);

                if (currentUser) {
                    await loadUnlockedGames();
                }

                switchTab('free');

            } catch (error) {
                console.error('Error loading games:', error);
                document.getElementById('gamesGrid').innerHTML = `
                    <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-secondary);">
                        <p>❌ Error loading games: ${error.message}</p>
                        <button onclick="loadGames()" style="margin-top:10px;padding:8px 20px;background:var(--accent);color:white;border:none;border-radius:8px;cursor:pointer;">🔄 Refresh</button>
                    </div>
                `;
            }
        }

        // ============================================================
        // TAB SWITCHING - Free & VIP ONLY
        // ============================================================
        function switchTab(tab) {
            currentTab = tab;

            document.querySelectorAll('.menu-bar .menu-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });

            let filtered = [];

            if (tab === 'free') {
                filtered = allGames.filter(g => g.isFree === true || g.tier === 'free' || (g.price === 0 || g.price ===
                null));
            } else if (tab === 'vip') {
                filtered = allGames.filter(g => g.isVip === true || g.tier === 'vip');
            }

            renderGames(filtered);
        }

        // ============================================================
        // RENDER GAMES
        // ============================================================
        function renderGames(games) {
            const grid = document.getElementById('gamesGrid');

            if (games.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-secondary);">
                        <p style="font-size:24px;margin-bottom:10px;">🎮</p>
                        <p style="font-size:18px;">No games found</p>
                        <p style="font-size:14px;margin-top:8px;">Check back soon for new games!</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = games.map(game => renderGameCard(game)).join('');
        }

        // ============================================================
        // RENDER GAME CARD
        // ============================================================
        function renderGameCard(game) {
            const gameId = game.id || 'game-' + Date.now() + Math.random();
            const isUnlocked = isGameUnlocked(gameId);
            const icon = getGameIcon(game.name || '');
            const downloadLinks = game.downloadLinks || [];
            const firstLink = downloadLinks.length > 0 ? downloadLinks[0] : '#';
            const fileSize = game.fileSize || 'Unknown';
            const isPaid = game.price > 0;
            const priceDisplay = isPaid ? `TZS ${Number(game.price).toLocaleString()}` : 'Free';
            const isVipGame = game.isVip === true || game.tier === 'vip';

            // Badge
            let badge = '';
            if (isVipGame) {
                badge = `<span class="card-badge badge-vip">⭐ VIP</span>`;
            } else {
                badge = `<span class="card-badge badge-free">🆓 FREE</span>`;
            }

            // Unlocked badge
            let unlockedBadge = '';
            if (isUnlocked) {
                unlockedBadge = `<span class="unlocked-badge" style="position:absolute;top:14px;left:14px;padding:6px 16px;border-radius:20px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;z-index:2;background:var(--success);color:white;box-shadow:0 4px 15px rgba(34,197,94,0.4);animation:pulseGreen 2s infinite;">🔓 UNLOCKED</span>`;
            }

            // Footer content
            let footerContent = '';

            if (isUnlocked) {
                footerContent = `
                    <a href="${firstLink}" class="download-btn" target="_blank" rel="noopener noreferrer">
                        ⬇️ Download Now <span class="arrow">↓</span>
                    </a>
                    ${downloadLinks.length > 1 ? `
                        <div class="download-links-small">
                            ${downloadLinks.slice(1).map((link, i) => `
                                <a href="${link}" class="dl-link" target="_blank" rel="noopener noreferrer">⬇️ Link ${i + 2}</a>
                            `).join('')}
                        </div>
                    ` : ''}
                    <div class="game-size">📦 ${fileSize}</div>
                `;
            } else if (isVipGame && isPaid) {
                footerContent = `
                    <div class="claim-section" id="claim-section-${gameId}">
                        <button class="claim-btn claim-toggle" onclick="toggleClaimInput('${gameId}')">
                            <span class="icon">🎫</span> Weka Claim
                        </button>
                        <div class="claim-input-group" id="claim-group-${gameId}" style="display:none;">
                            <input type="text" id="claim-input-${gameId}" placeholder="DVARY-XXXXXX" maxlength="20" />
                            <button class="claim-submit" id="claim-submit-${gameId}" onclick="thibitishaClaim('${gameId}', '${game.name}', '${firstLink}')">
                                Thibitisha
                            </button>
                        </div>
                        <div id="status-msg-${gameId}" class="status-msg"></div>
                    </div>
                    <div class="game-size">📦 ${fileSize}</div>
                `;
            } else {
                footerContent = `
                    <a href="${firstLink}" class="download-btn" target="_blank" rel="noopener noreferrer">
                        ⬇️ Download <span class="arrow">↓</span>
                    </a>
                    ${downloadLinks.length > 1 ? `
                        <div class="download-links-small">
                            ${downloadLinks.slice(1).map((link, i) => `
                                <a href="${link}" class="dl-link" target="_blank" rel="noopener noreferrer">⬇️ Link ${i + 2}</a>
                            `).join('')}
                        </div>
                    ` : ''}
                    <div class="game-size">📦 ${fileSize}</div>
                `;
            }

            // Screenshot button
            const screenshotImage = game.screenshotUrl || game.imageUrl || '';
            const screenshotName = game.name || 'Game';

            return `
                <div class="game-card" id="card-${gameId}" data-game-id="${gameId}" data-unlocked="${isUnlocked}">
                    <div class="card-image">
                        ${game.imageUrl ? `<img src="${game.imageUrl}" alt="${game.name}" />` : icon}
                        ${badge}
                        ${unlockedBadge}
                    </div>
                    <div class="card-body">
                        <div class="name">${game.name || 'Unnamed Game'}</div>
                        <div class="genre">${game.genre || 'General'}</div>
                        <div class="price-tag ${!isPaid ? 'free' : ''}">💰 ${priceDisplay}</div>
                        ${screenshotImage ? `
                            <button class="screenshot-btn" onclick="openScreenshot('${screenshotImage}', '${screenshotName}', '${game.description || ''}', '${firstLink}')">
                                📸 View Screenshot
                            </button>
                        ` : ''}
                        ${game.rating ? `<div style="margin-top:6px;color:#fbbf24;font-size:15px;">${'⭐'.repeat(Math.round(game.rating))} ${game.rating}/5</div>` : ''}
                        ${game.platform ? `<div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">🖥️ <span style="color:var(--accent);">${game.platform}</span></div>` : ''}
                    </div>
                    <div class="card-footer" id="footer-${gameId}">
                        ${footerContent}
                    </div>
                </div>
            `;
        }

        // ============================================================
        // SCREENSHOT MODAL
        // ============================================================
        function openScreenshot(imageUrl, gameName, description, downloadLink) {
            const modal = document.getElementById('screenshotModal');
            const img = document.getElementById('screenshotImage');
            const name = document.getElementById('modalGameName');
            const desc = document.getElementById('modalGameDesc');
            const downloadBtn = document.getElementById('modalDownloadBtn');

            img.src = imageUrl;
            name.textContent = gameName;
            desc.textContent = description || 'No description available';
            downloadBtn.href = downloadLink;
            downloadBtn.download = gameName + '-screenshot.jpg';

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeScreenshot() {
            document.getElementById('screenshotModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // Close modal on background click
        document.getElementById('screenshotModal').addEventListener('click', function(e) {
            if (e.target === this) closeScreenshot();
        });

        // Close modal with ESC key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeScreenshot();
        });

        // ============================================================
        // THIBITISHA CLAIM
        // ============================================================
        async function thibitishaClaim(gameId, gameName, downloadLink) {
            if (!currentUser) {
                showToast('🔒 Tafadhali login kwanza', 'error');
                return;
            }

            const claimInput = document.getElementById(`claim-input-${gameId}`);
            if (!claimInput) {
                showToast('❌ Hitilafu: Tafadhali jaribu tena', 'error');
                return;
            }

            const code = claimInput.value.trim().toUpperCase();

            if (!code) {
                showStatusMessage(gameId, '❌ Tafadhali weka namba ya claim', 'error');
                claimInput.focus();
                return;
            }

            if (code.length < 4) {
                showStatusMessage(gameId, '❌ Namba ya claim ni fupi sana', 'error');
                claimInput.focus();
                return;
            }

            const claimSubmit = document.getElementById(`claim-submit-${gameId}`);
            if (claimSubmit) {
                claimSubmit.disabled = true;
                claimSubmit.textContent = '⏳...';
            }

            try {
                showStatusMessage(gameId, '🔍 Inathibitisha claim...', 'info');

                const claimsRef = db.collection('claims');
                const q = claimsRef.where('code', '==', code).where('isUsed', '==', false);
                const snapshot = await q.get();

                if (snapshot.empty) {
                    showStatusMessage(gameId, '❌ Namba ya claim si sahihi au imeshachakaa', 'error');
                    if (claimSubmit) {
                        claimSubmit.disabled = false;
                        claimSubmit.textContent = 'Thibitisha';
                    }
                    return;
                }

                const doc = snapshot.docs[0];
                const claimData = doc.data();

                if (claimData.assignedToEmail && claimData.assignedToEmail !== currentUserEmail) {
                    showStatusMessage(gameId, '❌ Namba hii haikukabidhiwa kwako', 'error');
                    if (claimSubmit) {
                        claimSubmit.disabled = false;
                        claimSubmit.textContent = 'Thibitisha';
                    }
                    return;
                }

                await db.collection('claims').doc(doc.id).update({
                    isUsed: true,
                    usedByEmail: currentUserEmail,
                    usedByUid: currentUser.uid,
                    usedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showStatusMessage(gameId, '✅ Claim imethibitishwa!', 'success');

                const unlocked = await unlockGameForUser(gameId, gameName, downloadLink);

                if (unlocked) {
                    switchToDownloadMode(gameId, gameName, downloadLink);
                    showToast(`🎉 Umefanikiwa kufungua ${gameName} kwa claim!`, 'success');
                } else {
                    showStatusMessage(gameId, '❌ Hitilafu wakati wa kufungua mchezo', 'error');
                }

            } catch (error) {
                console.error('Claim error:', error);
                showStatusMessage(gameId, '❌ Hitilafu: ' + error.message, 'error');
                if (claimSubmit) {
                    claimSubmit.disabled = false;
                    claimSubmit.textContent = 'Thibitisha';
                }
            }
        }

        // ============================================================
        // SWITCH TO DOWNLOAD MODE
        // ============================================================
        function switchToDownloadMode(gameId, gameName, downloadLink) {
            const claimSection = document.getElementById(`claim-section-${gameId}`);
            if (claimSection) claimSection.style.display = 'none';

            const footer = document.getElementById(`footer-${gameId}`);
            if (footer) {
                footer.innerHTML = `
                    <a href="${downloadLink}" class="download-btn" target="_blank" rel="noopener noreferrer">
                        ⬇️ Download Now <span class="arrow">↓</span>
                    </a>
                    <div class="game-size">📦 ${getGameFileSize(gameId)}</div>
                `;
            }

            const card = document.getElementById(`card-${gameId}`);
            if (card) {
                card.dataset.unlocked = 'true';
                const imageDiv = card.querySelector('.card-image');
                if (imageDiv && !imageDiv.querySelector('.unlocked-badge')) {
                    const badge = document.createElement('span');
                    badge.className = 'unlocked-badge';
                    badge.style.cssText =
                        'position:absolute;top:14px;left:14px;padding:6px 16px;border-radius:20px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;z-index:2;background:var(--success);color:white;box-shadow:0 4px 15px rgba(34,197,94,0.4);animation:pulseGreen 2s infinite;';
                    badge.textContent = '🔓 UNLOCKED';
                    imageDiv.appendChild(badge);
                }
                const priceBadge = card.querySelector('.badge-price');
                if (priceBadge) priceBadge.remove();
            }

            unlockedGames.add(gameId);
        }

        // ============================================================
        // TOGGLE CLAIM INPUT
        // ============================================================
        function toggleClaimInput(gameId) {
            const group = document.getElementById(`claim-group-${gameId}`);
            if (group) {
                if (group.style.display === 'none') {
                    group.style.display = 'flex';
                    const input = document.getElementById(`claim-input-${gameId}`);
                    if (input) input.focus();
                } else {
                    group.style.display = 'none';
                }
            }
            const status = document.getElementById(`status-msg-${gameId}`);
            if (status) {
                status.className = '';
                status.textContent = '';
                status.style.display = 'none';
            }
        }

        // ============================================================
        // SHOW STATUS MESSAGE
        // ============================================================
        function showStatusMessage(gameId, message, type = 'info') {
            const statusMsg = document.getElementById(`status-msg-${gameId}`);
            if (!statusMsg) return;
            statusMsg.className = '';
            statusMsg.classList.add(type);
            statusMsg.textContent = message;
            statusMsg.style.display = 'block';
            if (type !== 'error') {
                setTimeout(() => {
                    statusMsg.style.display = 'none';
                }, 8000);
            }
        }

        // ============================================================
        // SHOW TOAST
        // ============================================================
        function showToast(message, type = 'info') {
            const existing = document.querySelector('.notification-toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `notification-toast ${type}`;
            toast.innerHTML = `
                ${message}
                <button class="close-btn" onclick="this.parentElement.remove()">×</button>
            `;
            document.body.appendChild(toast);

            setTimeout(() => {
                if (toast.parentElement) toast.remove();
            }, 5000);
        }

        // ============================================================
        // GET GAME ICON
        // ============================================================
        function getGameIcon(name) {
            const icons = ['🎮', '⚔️', '🏎️', '🧙', '🚀', '🏆', '🎯', '👾', '🤖', '👽', '🕹️', '🎲'];
            const index = (name || '').length % icons.length;
            return icons[index] || '🎮';
        }

        function getGameFileSize(gameId) {
            const game = allGames.find(g => g.id === gameId);
            return game ? game.fileSize : 'Unknown';
        }

        // ============================================================
        // NOTIFICATIONS
        // ============================================================
        async function loadNotifications() {
            try {
                const snapshot = await db.collection('notifications')
                    .orderBy('createdAt', 'desc')
                    .limit(20)
                    .get();
                notifications = [];
                snapshot.forEach(doc => {
                    const notif = doc.data();
                    notif.id = doc.id;
                    notifications.push(notif);
                });
                updateNotificationUI();
            } catch (error) {
                console.error('Error loading notifications:', error);
            }
        }

        function updateNotificationUI() {
            const list = document.getElementById('notifList');
            const badge = document.getElementById('notifBadge');
            const unread = notifications.filter(n => !n.read).length;

            if (unread > 0) {
                badge.textContent = unread > 9 ? '9+' : unread;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            if (notifications.length === 0) {
                list.innerHTML =
                    `<div class="notif-empty"><span class="icon">🔕</span><p>No notifications yet</p></div>`;
                return;
            }

            list.innerHTML = notifications.map(notif => `
                <div class="notif-item" style="padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:all 0.3s ease;display:flex;gap:12px;align-items:flex-start;">
                    <div class="notif-icon" style="font-size:18px;width:32px;height:32px;background:var(--glass-bg);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${notif.icon || '📢'}</div>
                    <div class="notif-content" style="flex:1;">
                        <div class="title" style="font-size:13px;font-weight:600;color:var(--text-primary);">${notif.title || 'Update'}</div>
                        <div class="desc" style="font-size:12px;color:var(--text-secondary);margin-top:2px;">${notif.message || ''}</div>
                        <div class="time" style="font-size:11px;color:var(--text-secondary);margin-top:4px;opacity:0.7;">${formatTime(notif.createdAt)}</div>
                    </div>
                </div>
            `).join('');
        }

        function formatTime(timestamp) {
            if (!timestamp) return 'Just now';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const diff = Date.now() - date;
            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
            if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
            return date.toLocaleDateString();
        }

        function toggleNotifications() {
            const dropdown = document.getElementById('notifDropdown');
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        }

        function clearNotifications() {
            notifications = [];
            document.getElementById('notifList').innerHTML =
                `<div class="notif-empty" style="padding:30px 20px;text-align:center;color:var(--text-secondary);"><span class="icon" style="font-size:40px;display:block;margin-bottom:10px;">🔕</span><p>No notifications</p></div>`;
            document.getElementById('notifBadge').classList.add('hidden');
            document.getElementById('notifDropdown').style.display = 'none';
        }

        // ============================================================
        // MOBILE MENU
        // ============================================================
        function toggleMobileMenu() {
            const drawer = document.getElementById('mobileDrawer');
            const overlay = document.getElementById('mobileOverlay');
            if (drawer) {
                drawer.classList.toggle('open');
                if (overlay) overlay.classList.toggle('open');
            }
        }

        // ============================================================
        // SEARCH
        // ============================================================
        document.getElementById('searchInput').addEventListener('input', function() {
            const query = this.value.trim().toLowerCase();
            if (!query) {
                switchTab(currentTab);
                return;
            }

            const filtered = allGames.filter(g =>
                g.name?.toLowerCase().includes(query) ||
                g.genre?.toLowerCase().includes(query) ||
                g.description?.toLowerCase().includes(query)
            );

            renderGames(filtered);
        });

        // ============================================================
        // INIT
        // ============================================================
        console.log('🎮 DVARY GAMES Main Website loaded!');
        console.log('📌 Features: Free Games | VIP Games | Screenshot Viewer | Claim System');
        console.log('🔓 Unlocked games persistence enabled!');
        console.log('🎫 Claim system enabled for VIP games!');
    </script>

</body>
