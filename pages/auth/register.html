<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVARY GAMES - Register</title>
    <!-- FontAwesome kwa ajili ya icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- CSS maalum ya ukurasa huu -->
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <!-- SIDEBAR MENU -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>DVARY <span>GAMES</span></h2>
        </div>
        <ul class="sidebar-links">
            <li><a href="../../public/index.html"><i class="fas fa-home"></i> <span>Home</span></a></li>
            <li><a href="../games/games.html"><i class="fas fa-gamepad"></i> <span>Games</span></a></li>
            <li><a href="../ai/ai.html"><i class="fas fa-robot"></i> <span>AI Chat</span></a></li>
            <li><a href="login.html"><i class="fas fa-sign-in-alt"></i> <span>Login</span></a></li>
        </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <header class="top-bar">
            <h1>Tengeneza Akaunti Mpya</h1>
            <p>Jiunge na jumuiya yetu ya wachezaji leo</p>
        </header>

        <section class="auth-form-section">
            <div class="form-card">
                <h3>Register</h3>
                <form id="registerForm">
                    <div class="input-group">
                        <label for="regEmail">Barua pepe (Email)</label>
                        <input type="email" id="regEmail" placeholder="mchezaji@example.com" required>
                    </div>
                    <div class="input-group">
                        <label for="regPassword">Neno la Siri (Password)</label>
                        <input type="password" id="regPassword" placeholder="********" required>
                    </div>
                    <button type="submit" class="btn-submit"><i class="fas fa-user-plus"></i> Jisajili</button>
                </form>
            </div>
        </section>
    </main>

    <!-- FIREBASE SDK & REGISTER SCRIPT -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries

        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
          apiKey: "AIzaSyCmwASW4XXQ3O0AvsCM_r1WLlrUmGjYVxI",
          authDomain: "dvary-9a7d0.firebaseapp.com",
          projectId: "dvary-9a7d0",
          storageBucket: "dvary-9a7d0.firebasestorage.app",
          messagingSenderId: "107370806066",
          appId: "1:107370806066:web:4c2ce1e6f7b6c32909f52b",
          measurementId: "G-07361LFJEP"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);

        console.log("Firebase initialized successfully on register.html");

        // Logic ya Register
        const registerForm = document.getElementById('registerForm');
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert("✅ Akaunti imetengenezwa kwa mafanikio!");
                window.location.href = "login.html";
            } catch (error) {
                console.error("Hitilafu ya kusajili:", error.message);
                alert("❌ Imeshindikana kusajili: " + error.message);
            }
        });
    </script>
</body>
</html>
