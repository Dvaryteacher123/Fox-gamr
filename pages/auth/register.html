<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - DVARY GAMES</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-container {
            background: #1a1a2e;
            padding: 3rem 2.5rem;
            border-radius: 20px;
            border: 1px solid #2a2a4e;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .register-container .logo {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            color: #e94560;
            margin-bottom: 0.5rem;
        }

        .register-container .logo span {
            color: #fff;
        }

        .register-container .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: #ccc;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.6rem;
            border: 2px solid #2a2a4e;
            border-radius: 10px;
            background: #0f0f1a;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #e94560;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.12);
        }

        .form-group input::placeholder {
            color: #444;
        }

        .form-group .password-hint {
            font-size: 0.75rem;
            color: #555;
            margin-top: 0.3rem;
        }

        .btn-register {
            width: 100%;
            padding: 0.85rem;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        .btn-register:hover {
            background: #c73652;
            transform: scale(1.02);
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #888;
            font-size: 0.9rem;
        }

        .login-link a {
            color: #e94560;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: rgba(231, 76, 60, 0.12);
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 0.7rem 1rem;
            border-radius: 10px;
            margin-bottom: 1.2rem;
            font-size: 0.85rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: rgba(46, 204, 113, 0.12);
            border: 1px solid #2ecc71;
            color: #2ecc71;
            padding: 0.7rem 1rem;
            border-radius: 10px;
            margin-bottom: 1.2rem;
            font-size: 0.85rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 1.2rem;
            color: #666;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .back-home:hover {
            color: #e94560;
        }

        .back-home i {
            margin-right: 0.5rem;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.2rem 0;
            color: #444;
            font-size: 0.75rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #2a2a4e;
        }

        .divider::before {
            margin-right: 1rem;
        }

        .divider::after {
            margin-left: 1rem;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1a1a2e;
            color: #fff;
            padding: 0.9rem 1.8rem;
            border-radius: 12px;
            border-left: 4px solid #e94560;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.5s ease;
            z-index: 9999;
            max-width: 380px;
            font-size: 0.9rem;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-left-color: #2ecc71;
        }

        .toast.error {
            border-left-color: #e74c3c;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .password-strength {
            height: 4px;
            border-radius: 4px;
            margin-top: 0.3rem;
            background: #2a2a4e;
            transition: all 0.3s ease;
        }

        .password-strength.weak {
            background: #e74c3c;
            width: 33%;
        }
        .password-strength.medium {
            background: #f39c12;
            width: 66%;
        }
        .password-strength.strong {
            background: #2ecc71;
            width: 100%;
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 1.8rem 1.2rem;
                margin: 1rem;
            }

            .register-container .logo {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="logo">DVARY <span>GAMES</span></div>
        <p class="subtitle">Create your account and start playing</p>

        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText">Registration failed</span>
        </div>

        <div class="success-message" id="successMessage">
            <i class="fas fa-check-circle"></i>
            <span id="successText">Account created!</span>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Choose a username" required minlength="3" />
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Enter your email" required />
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Min 6 characters" required minlength="6" />
                </div>
                <div class="password-strength" id="passwordStrength"></div>
                <div class="password-hint">Use at least 6 characters</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-check-circle"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required />
                </div>
            </div>

            <button type="submit" class="btn-register" id="registerBtn">
                <span id="registerText">Create Account</span>
                <span id="registerSpinner" style="display:none;"><span class="spinner"></span></span>
            </button>
        </form>

        <div class="divider">OR</div>

        <p class="login-link">
            Already have an account? <a href="/pages/auth/login.html">Login now</a>
        </p>

        <a href="/" class="back-home">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- FIREBASE CONFIG -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged } from "firebase/auth";
        import { getFirestore, doc, setDoc } from "firebase/firestore";

        const firebaseConfig = {
            apiKey: "AIzaSyCmwASW4XXQ3O0AvsCM_r1WLlrUmGjYVxI",
            authDomain: "dvary-9a7d0.firebaseapp.com",
            projectId: "dvary-9a7d0",
            storageBucket: "dvary-9a7d0.firebasestorage.app",
            messagingSenderId: "107370806066",
            appId: "1:107370806066:web:4c2ce1e6f7b6c32909f52b",
            measurementId: "G-07361LFJEP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const form = document.getElementById('registerForm');
        const username = document.getElementById('username');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const registerBtn = document.getElementById('registerBtn');
        const registerText = document.getElementById('registerText');
        const registerSpinner = document.getElementById('registerSpinner');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const successMessage = document.getElementById('successMessage');
        const successText = document.getElementById('successText');
        const passwordStrength = document.getElementById('passwordStrength');
        const toast = document.getElementById('toast');

        function showToast(message, type = 'info') {
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = '/';
            }
        });

        // Password strength
        password.addEventListener('input', () => {
            const val = password.value;
            if (val.length === 0) {
                passwordStrength.className = 'password-strength';
                return;
            }
            if (val.length < 4) {
                passwordStrength.className = 'password-strength weak';
            } else if (val.length < 8) {
                passwordStrength.className = 'password-strength medium';
            } else {
                passwordStrength.className = 'password-strength strong';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');

            const usernameValue = username.value.trim();
            const emailValue = email.value.trim();
            const passwordValue = password.value;
            const confirmValue = confirmPassword.value;

            if (!usernameValue || !emailValue || !passwordValue || !confirmValue) {
                errorText.textContent = 'Please fill in all fields';
                errorMessage.classList.add('show');
                return;
            }

            if (usernameValue.length < 3) {
                errorText.textContent = 'Username must be at least 3 characters';
                errorMessage.classList.add('show');
                return;
            }

            if (passwordValue.length < 6) {
                errorText.textContent = 'Password must be at least 6 characters';
                errorMessage.classList.add('show');
                return;
            }

            if (passwordValue !== confirmValue) {
                errorText.textContent = 'Passwords do not match';
                errorMessage.classList.add('show');
                return;
            }

            registerBtn.disabled = true;
            registerText.style.display = 'none';
            registerSpinner.style.display = 'inline-block';

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, emailValue, passwordValue);
                const user = userCredential.user;

                await updateProfile(user, {
                    displayName: usernameValue
                });

                await setDoc(doc(db, 'users', user.uid), {
                    username: usernameValue,
                    email: emailValue,
                    createdAt: new Date().toISOString(),
                    role: 'user'
                });

                successText.textContent = 'Account created successfully! Redirecting...';
                successMessage.classList.add('show');
                showToast('Welcome ' + usernameValue + '!', 'success');

                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);

            } catch (error) {
                let message = 'Registration failed. Please try again.';
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        message = 'This email is already registered.';
                        break;
                    case 'auth/invalid-email':
                        message = 'Invalid email address format.';
                        break;
                    case 'auth/weak-password':
                        message = 'Password is too weak. Use at least 6 characters.';
                        break;
                    default:
                        message = error.message;
                }
                errorText.textContent = message;
                errorMessage.classList.add('show');
                showToast(message, 'error');

            } finally {
                registerBtn.disabled = false;
                registerText.style.display = 'inline';
                registerSpinner.style.display = 'none';
            }
        });

        confirmPassword.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });
    </script>

</body>
</html>
