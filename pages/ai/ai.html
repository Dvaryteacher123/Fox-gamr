<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVARY GAMES - AI Chat</title>
    <!-- FontAwesome kwa ajili ya icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- CSS maalum ya ukurasa wa AI -->
    <link rel="stylesheet" href="ai.css">
</head>
<body>

    <!-- SIDEBAR MENU -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>DVARY <span>GAMES</span></h2>
        </div>
        <ul class="sidebar-links">
            <li><a href="../../public/index.html"><i class="fas fa-home"></i> <span>Home</span></a></li>
            <li><a href="../games/games.html"><i class="fas fa-gamepad"></i> <span>Games</span></a></li>
            <li><a href="ai.html" class="active"><i class="fas fa-robot"></i> <span>AI Chat</span></a></li>
            <li><a href="../../admin/index.html"><i class="fas fa-crown"></i> <span>Admin</span></a></li>
        </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <header class="top-bar">
            <h1>Msaidizi wa AI (OpenRouter)</h1>
            <p>Uliza lolote kuhusu michezo au ushauri wa kiufundi</p>
        </header>

        <section class="chat-section">
            <div class="chat-box" id="chatBox">
                <div class="chat-message ai-message">
                    <p>Habari! Mimi ni AI assistant wa DVARY GAMES. Nikusaidie nini leo?</p>
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Andika ujumbe wako hapa...">
                <button id="sendBtn"><i class="fas fa-paper-plane"></i> Tuma</button>
            </div>
        </section>
    </main>

    <!-- FIREBASE SDK & OPENROUTER API SCRIPT -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries

        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
          apiKey: "AIzaSyCmwASW4XXQ3O0AvsCM_r1WLlrUmGjYVxI",
          authDomain: "dvary-9a7d0.firebaseapp.com",
          projectId: "dvary-9a7d0",
          storageBucket: "dvary-9a7d0.firebasestorage.app",
          messagingSenderId: "107370806066",
          appId: "1:107370806066:web:4c2ce1e6f7b6c32909f52b",
          measurementId: "G-07361LFJEP"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        console.log("Firebase initialized successfully on ai.html");

        // OpenRouter Integration Logic (Mfano wa kuunganisha OpenRouter)
        const sendBtn = document.getElementById('sendBtn');
        const userInput = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');

        sendBtn.addEventListener('click', async () => {
            const text = userInput.value.trim();
            if(!text) return;

            // Onyesha ujumbe wa mtumiaji
            const userMsg = document.createElement('div');
            userMsg.className = 'chat-message user-message';
            userMsg.innerHTML = `<p>${text}</p>`;
            chatBox.appendChild(userMsg);
            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Hapa unaweza kuweka fetch kwenda OpenRouter API kupitia Backend yako au moja kwa moja
            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'chat-message ai-message';
                aiMsg.innerHTML = `<p>Nashughulikia ombi lako kupitia OpenRouter...</p>`;
                chatBox.appendChild(aiMsg);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        });
    </script>
</body>
</html>
