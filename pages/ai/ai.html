<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat - DVARY GAMES</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e94560;
            position: sticky;
            top: 0;
            z-index: 1000;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #e94560;
            text-decoration: none;
        }

        .logo span {
            color: #fff;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: #e94560;
            color: #fff;
            transform: translateY(-2px);
        }

        .nav-links a.active {
            background: #e94560;
            color: #fff;
        }

        .auth-buttons {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #e94560;
            color: #fff;
        }

        .btn-primary:hover {
            background: #c73652;
            transform: scale(1.05);
        }

        .btn-outline {
            background: transparent;
            color: #fff;
            border: 2px solid #e94560;
        }

        .btn-outline:hover {
            background: #e94560;
            color: #fff;
        }

        .btn-success {
            background: #2ecc71;
            color: #fff;
        }

        .btn-success:hover {
            background: #27ae60;
            transform: scale(1.05);
        }

        .user-menu {
            position: relative;
            display: inline-block;
        }

        .user-menu .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e94560;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .user-menu .user-avatar:hover {
            border-color: #fff;
        }

        .user-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 50px;
            background: #1a1a2e;
            border-radius: 12px;
            min-width: 180px;
            border: 1px solid #2a2a4e;
            padding: 0.5rem 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .user-dropdown.show {
            display: block;
        }

        .user-dropdown a {
            display: block;
            padding: 0.7rem 1.5rem;
            color: #fff;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .user-dropdown a:hover {
            background: #e94560;
        }

        .user-dropdown .divider {
            height: 1px;
            background: #2a2a4e;
            margin: 0.3rem 0;
        }

        .ai-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .ai-header h1 {
            font-size: 2.2rem;
            color: #e94560;
        }

        .ai-header .ai-badge {
            background: #1a1a2e;
            border: 1px solid #e94560;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #e94560;
        }

        .ai-header .ai-status {
            font-size: 0.85rem;
            color: #2ecc71;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .ai-header .ai-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2ecc71;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .chat-box {
            background: #1a1a2e;
            border-radius: 16px;
            border: 1px solid #2a2a4e;
            height: 450px;
            overflow-y: auto;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .chat-box::-webkit-scrollbar {
            width: 6px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: #0f0f1a;
            border-radius: 10px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 10px;
        }

        .message {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: #e94560;
            color: #fff;
        }

        .message.ai .avatar {
            background: #2a2a4e;
            color: #e94560;
            border: 1px solid #e94560;
        }

        .message .content {
            background: #0f0f1a;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .message.user .content {
            background: #e94560;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.ai .content {
            background: #0f0f1a;
            border: 1px solid #2a2a4e;
            border-bottom-left-radius: 4px;
            color: #ddd;
        }

        .message .content .time {
            font-size: 0.65rem;
            color: #666;
            margin-top: 0.3rem;
            display: block;
        }

        .message.user .content .time {
            color: rgba(255, 255, 255, 0.5);
        }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 0.8rem;
            padding: 0.5rem 0;
        }

        .typing-indicator .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #2a2a4e;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e94560;
            border: 1px solid #e94560;
            font-size: 0.8rem;
        }

        .typing-indicator .dots {
            display: flex;
            gap: 4px;
            background: #0f0f1a;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            border: 1px solid #2a2a4e;
        }

        .typing-indicator .dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
            animation: typing 1.4s ease-in-out infinite;
        }

        .typing-indicator .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.3;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        .chat-input {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            background: #1a1a2e;
            border: 1px solid #2a2a4e;
            border-radius: 16px;
            padding: 0.5rem 0.5rem 0.5rem 1.5rem;
        }

        .chat-input input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            padding: 0.8rem 0;
            outline: none;
        }

        .chat-input input::placeholder {
            color: #555;
        }

        .chat-input .btn-send {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chat-input .btn-send:hover {
            background: #c73652;
            transform: scale(1.02);
        }

        .chat-input .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .chat-input .btn-send i {
            font-size: 1.1rem;
        }

        .chat-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .chat-actions button {
            background: transparent;
            border: 1px solid #2a2a4e;
            color: #666;
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
        }

        .chat-actions button:hover {
            border-color: #e94560;
            color: #e94560;
        }

        .chat-actions button i {
            margin-right: 0.5rem;
        }

        .footer {
            background: #0a0a0f;
            padding: 2rem;
            text-align: center;
            border-top: 1px solid #1a1a2e;
            color: #666;
            font-size: 0.9rem;
            margin-top: 2rem;
        }

        .footer a {
            color: #e94560;
            text-decoration: none;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1a1a2e;
            color: #fff;
            padding: 1rem 2rem;
            border-radius: 12px;
            border-left: 4px solid #e94560;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.5s ease;
            z-index: 9999;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-left-color: #2ecc71;
        }

        .toast.error {
            border-left-color: #e74c3c;
        }

        /* Quick prompts */
        .quick-prompts {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .quick-prompts button {
            background: #0f0f1a;
            border: 1px solid #2a2a4e;
            color: #888;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quick-prompts button:hover {
            border-color: #e94560;
            color: #e94560;
            background: #1a1a2e;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }

            .nav-links {
                justify-content: center;
            }

            .auth-buttons {
                justify-content: center;
            }

            .ai-container {
                padding: 0 1rem;
                margin: 1rem auto;
            }

            .ai-header {
                flex-wrap: wrap;
            }

            .ai-header h1 {
                font-size: 1.6rem;
            }

            .chat-box {
                height: 350px;
                padding: 1rem;
            }

            .message .content {
                max-width: 90%;
                font-size: 0.9rem;
            }

            .chat-input {
                padding: 0.3rem 0.3rem 0.3rem 1rem;
            }

            .chat-input input {
                font-size: 0.9rem;
                padding: 0.6rem 0;
            }

            .chat-input .btn-send {
                padding: 0.6rem 1.2rem;
                font-size: 0.9rem;
            }

            .quick-prompts {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .nav-links {
                gap: 0.5rem;
            }

            .nav-links a {
                font-size: 0.8rem;
                padding: 0.3rem 0.8rem;
            }

            .chat-box {
                height: 280px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">DVARY <span>GAMES</span></a>

        <ul class="nav-links">
            <li><a href="/"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="/pages/games/games.html"><i class="fas fa-gamepad"></i> Games</a></li>
            <li><a href="/pages/ai/ai.html" class="active"><i class="fas fa-robot"></i> AI Chat</a></li>
            <li><a href="/pages/community/community.html"><i class="fas fa-users"></i> Community</a></li>
        </ul>

        <div class="auth-buttons" id="authButtons">
            <a href="/pages/auth/login.html" class="btn btn-outline">Login</a>
            <a href="/pages/auth/register.html" class="btn btn-primary">Register</a>
        </div>

        <div class="user-menu" id="userMenu" style="display:none;">
            <div class="user-avatar" id="userAvatar" onclick="toggleDropdown()">
                <span id="avatarText">U</span>
            </div>
            <div class="user-dropdown" id="userDropdown">
                <a href="/pages/profile/profile.html"><i class="fas fa-user"></i> Profile</a>
                <a href="/admin/index.html" id="adminLink"><i class="fas fa-crown"></i> Admin</a>
                <div class="divider"></div>
                <a href="#" onclick="logoutUser()"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </nav>

    <div class="ai-container">
        <div class="ai-header">
            <h1><i class="fas fa-robot"></i> AI Chat</h1>
            <span class="ai-badge">OpenRouter</span>
            <span class="ai-status">
                <span class="dot"></span> Online
            </span>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message ai">
                <div class="avatar">AI</div>
                <div class="content">
                    Hello! I'm your gaming assistant. Ask me anything about games, tips, or just chat with me!
                    <span class="time">Just now</span>
                </div>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <div class="avatar">AI</div>
            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Ask me anything..." />
            <button class="btn-send" id="sendBtn">
                <i class="fas fa-paper-plane"></i> Send
            </button>
        </div>

        <div class="quick-prompts">
            <button onclick="sendQuickPrompt('What games do you recommend?')">🎮 Recommend games</button>
            <button onclick="sendQuickPrompt('How to improve gaming skills?')">⚡ Gaming tips</button>
            <button onclick="sendQuickPrompt('Tell me about DVARY GAMES')">ℹ️ About DVARY</button>
            <button onclick="sendQuickPrompt('What is the best game?')">🏆 Best game</button>
        </div>

        <div class="chat-actions">
            <button onclick="clearChat()"><i class="fas fa-trash-alt"></i> Clear Chat</button>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 <a href="/">DVARY GAMES</a>. All rights reserved.</p>
    </footer>

    <div class="toast" id="toast"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, signOut, onAuthStateChanged } from "firebase/auth";

        const firebaseConfig = {
            apiKey: "AIzaSyCmwASW4XXQ3O0AvsCM_r1WLlrUmGjYVxI",
            authDomain: "dvary-9a7d0.firebaseapp.com",
            projectId: "dvary-9a7d0",
            storageBucket: "dvary-9a7d0.firebasestorage.app",
            messagingSenderId: "107370806066",
            appId: "1:107370806066:web:4c2ce1e6f7b6c32909f52b",
            measurementId: "G-07361LFJEP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const toast = document.getElementById('toast');

        function showToast(message, type = 'info') {
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        window.toggleDropdown = function() {
            document.getElementById('userDropdown').classList.toggle('show');
        };

        window.logoutUser = function() {
            signOut(auth).then(() => {
                showToast('Logged out', 'success');
                document.getElementById('userDropdown').classList.remove('show');
            }).catch((error) => {
                showToast('Error: ' + error.message, 'error');
            });
        };

        document.addEventListener('click', function(event) {
            const menu = document.querySelector('.user-menu');
            if (menu && !menu.contains(event.target)) {
                document.getElementById('userDropdown').classList.remove('show');
            }
        });

        onAuthStateChanged(auth, (user) => {
            const authButtons = document.getElementById('authButtons');
            const userMenu = document.getElementById('userMenu');
            const avatarText = document.getElementById('avatarText');

            if (user) {
                authButtons.style.display = 'none';
                userMenu.style.display = 'block';
                avatarText.textContent = user.email ? user.email.charAt(0).toUpperCase() : 'U';

                const adminLink = document.getElementById('adminLink');
                if (user.email === 'admin@dvary.com') {
                    adminLink.style.display = 'block';
                } else {
                    adminLink.style.display = 'none';
                }
            } else {
                authButtons.style.display = 'flex';
                userMenu.style.display = 'none';
            }
        });

        function addMessage(text, sender = 'user') {
            const div = document.createElement('div');
            div.className = `message ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = sender === 'user' ? 'U' : 'AI';

            const content = document.createElement('div');
            content.className = 'content';

            const textSpan = document.createElement('span');
            textSpan.textContent = text;

            const time = document.createElement('span');
            time.className = 'time';
            time.textContent = new Date().toLocaleTimeString();

            content.appendChild(textSpan);
            content.appendChild(time);
            div.appendChild(avatar);
            div.appendChild(content);

            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showTyping() {
            typingIndicator.style.display = 'flex';
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function hideTyping() {
            typingIndicator.style.display = 'none';
        }

        async function sendMessage(message) {
            if (!message.trim()) return;

            addMessage(message, 'user');
            messageInput.value = '';
            sendBtn.disabled = true;
            showTyping();

            try {
                const response = await fetch('/api/ai/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();

                hideTyping();

                if (data.error) {
                    addMessage('❌ ' + data.error, 'ai');
                    showToast('Error: ' + data.error, 'error');
                } else {
                    addMessage(data.reply || 'No response from AI.', 'ai');
                }

            } catch (error) {
                hideTyping();
                addMessage('❌ Network error. Please try again.', 'ai');
                showToast('Network error: ' + error.message, 'error');
            }

            sendBtn.disabled = false;
            messageInput.focus();
        }

        window.sendQuickPrompt = function(text) {
            messageInput.value = text;
            sendMessage(text);
        };

        window.clearChat = function() {
            chatBox.innerHTML = `
                <div class="message ai">
                    <div class="avatar">AI</div>
                    <div class="content">
                        Chat cleared! How can I help you?
                        <span class="time">Just now</span>
                    </div>
                </div>
            `;
            showToast('Chat cleared', 'success');
        };

        sendBtn.addEventListener('click', () => {
            sendMessage(messageInput.value);
        });

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage(messageInput.value);
            }
        });
    </script>

</body>
</html>
