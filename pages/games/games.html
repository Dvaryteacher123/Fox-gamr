<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVARY GAMES - All Games</title>
    <!-- FontAwesome kwa ajili ya icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- CSS maalum ya ukurasa wa games -->
    <link rel="stylesheet" href="games.css">
</head>
<body>

    <!-- SIDEBAR MENU -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>DVARY <span>GAMES</span></h2>
        </div>
        <ul class="sidebar-links">
            <li><a href="../../public/index.html"><i class="fas fa-home"></i> <span>Home</span></a></li>
            <li><a href="games.html" class="active"><i class="fas fa-gamepad"></i> <span>Games</span></a></li>
            <li><a href="../ai/ai.html"><i class="fas fa-robot"></i> <span>AI Chat</span></a></li>
            <li><a href="../../admin/index.html"><i class="fas fa-crown"></i> <span>Admin</span></a></li>
        </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <header class="top-bar">
            <h1>Maktaba ya Michezo</h1>
            <p>Chagua mchezo uupendao na uanze kucheza sasa hivi</p>
        </header>

        <section class="games-container">
            <div class="search-bar-wrapper">
                <input type="text" id="searchGameInput" placeholder="Tafuta mchezo...">
            </div>
            <div class="games-grid" id="allGamesGrid">
                <!-- Hapa ndipo magame yatapakiwa kutoka Firebase kwa kutumia script hapa chini -->
            </div>
        </section>
    </main>

    <!-- FLOATING AI BUTTON -->
    <a href="../ai/ai.html" class="floating-ai" title="Chat with AI">
        <i class="fas fa-robot"></i>
    </a>

    <!-- FIREBASE SDK & GAME FETCH SCRIPT -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries

        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
          apiKey: "AIzaSyCmwASW4XXQ3O0AvsCM_r1WLlrUmGjYVxI",
          authDomain: "dvary-9a7d0.firebaseapp.com",
          projectId: "dvary-9a7d0",
          storageBucket: "dvary-9a7d0.firebasestorage.app",
          messagingSenderId: "107370806066",
          appId: "1:107370806066:web:4c2ce1e6f7b6c32909f52b",
          measurementId: "G-07361LFJEP"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        console.log("Firebase initialized successfully on games.html");

        // Logic ya kuchota magame kutoka Firebase Firestore
        async function loadGamesFromFirebase() {
            const grid = document.getElementById('allGamesGrid');
            try {
                const querySnapshot = await getDocs(collection(db, "games"));
                grid.innerHTML = "";
                
                if(querySnapshot.empty) {
                    grid.innerHTML = `<p style="color: #888; grid-column: 1/-1; text-align: center;">Hakuna magame bado. Nenda Admin uweke magame mapya!</p>`;
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const game = doc.data();
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <div class="game-img"><i class="fas fa-gamepad"></i></div>
                        <div class="game-info">
                            <h3>${game.title || 'Mchezo Mpya'}</h3>
                            <p>${game.description || 'Hakuna maelezo.'}</p>
                            <a href="#" class="btn-play">Cheza Sasa</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error("Hitilafu katika kupakua magame: ", error);
                grid.innerHTML = `<p style="color: #e94560; grid-column: 1/-1; text-align: center;">Imeshindikana kupakia magame.</p>`;
            }
        }

        // Tekeleza kazi ya kupakia magame kurasa inapofunguka
        window.addEventListener('DOMContentLoaded', loadGamesFromFirebase);
    </script>
</body>
</html>
