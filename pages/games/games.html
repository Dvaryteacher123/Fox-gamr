<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games - DVARY GAMES</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e94560;
            position: sticky;
            top: 0;
            z-index: 1000;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #e94560;
            text-decoration: none;
        }

        .logo span {
            color: #fff;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: #e94560;
            color: #fff;
            transform: translateY(-2px);
        }

        .nav-links a.active {
            background: #e94560;
            color: #fff;
        }

        .auth-buttons {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #e94560;
            color: #fff;
        }

        .btn-primary:hover {
            background: #c73652;
            transform: scale(1.05);
        }

        .btn-outline {
            background: transparent;
            color: #fff;
            border: 2px solid #e94560;
        }

        .btn-outline:hover {
            background: #e94560;
            color: #fff;
        }

        .user-menu {
            position: relative;
            display: inline-block;
        }

        .user-menu .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e94560;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .user-menu .user-avatar:hover {
            border-color: #fff;
        }

        .user-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 50px;
            background: #1a1a2e;
            border-radius: 12px;
            min-width: 180px;
            border: 1px solid #2a2a4e;
            padding: 0.5rem 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .user-dropdown.show {
            display: block;
        }

        .user-dropdown a {
            display: block;
            padding: 0.7rem 1.5rem;
            color: #fff;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .user-dropdown a:hover {
            background: #e94560;
        }

        .user-dropdown .divider {
            height: 1px;
            background: #2a2a4e;
            margin: 0.3rem 0;
        }

        .games-header {
            padding: 2rem 2rem 0.5rem 2rem;
        }

        .games-header h1 {
            font-size: 2.5rem;
            color: #e94560;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .games-header p {
            color: #888;
            font-size: 1.1rem;
            margin-top: 0.3rem;
        }

        .filter-bar {
            display: flex;
            gap: 1rem;
            padding: 1rem 2rem;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 1px solid #1a1a2e;
        }

        .filter-bar input {
            padding: 0.7rem 1rem;
            border-radius: 10px;
            border: 2px solid #2a2a4e;
            background: #0f0f1a;
            color: #fff;
            flex: 1;
            min-width: 200px;
            outline: none;
            transition: all 0.3s ease;
        }

        .filter-bar input:focus {
            border-color: #e94560;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.1);
        }

        .filter-bar input::placeholder {
            color: #444;
        }

        .filter-bar .filter-count {
            color: #666;
            font-size: 0.9rem;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            padding: 2rem;
        }

        .game-card {
            background: #1a1a2e;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #2a2a4e;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-10px);
            border-color: #e94560;
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.2);
        }

        .game-card-image {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #2a2a4e, #3a3a6e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: #e94560;
        }

        .game-card-body {
            padding: 1.5rem;
        }

        .game-card-body h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .game-card-body p {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .game-card-body .game-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-card-body .game-meta span {
            font-size: 0.8rem;
            color: #666;
        }

        .game-card-body .game-meta .play-btn {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 0.4rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .game-card-body .game-meta .play-btn:hover {
            background: #c73652;
            transform: scale(1.05);
        }

        .loading {
            text-align: center;
            padding: 4rem;
            color: #666;
        }

        .loading i {
            font-size: 2.5rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #666;
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: #2a2a4e;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #aaa;
        }

        .footer {
            background: #0a0a0f;
            padding: 2rem;
            text-align: center;
            border-top: 1px solid #1a1a2e;
            color: #666;
            font-size: 0.9rem;
        }

        .footer a {
            color: #e94560;
            text-decoration: none;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1a1a2e;
            color: #fff;
            padding: 1rem 2rem;
            border-radius: 12px;
            border-left: 4px solid #e94560;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.5s ease;
            z-index: 9999;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-left-color: #2ecc71;
        }

        .toast.error {
            border-left-color: #e74c3c;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }

            .nav-links {
                justify-content: center;
            }

            .auth-buttons {
                justify-content: center;
            }

            .games-header h1 {
                font-size: 1.8rem;
            }

            .games-grid {
                grid-template-columns: 1fr;
                padding: 1rem;
            }

            .filter-bar {
                flex-direction: column;
                padding: 1rem;
            }

            .filter-bar input {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .nav-links {
                gap: 0.5rem;
            }

            .nav-links a {
                font-size: 0.8rem;
                padding: 0.3rem 0.8rem;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">DVARY <span>GAMES</span></a>

        <ul class="nav-links">
            <li><a href="/"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="/pages/games/games.html" class="active"><i class="fas fa-gamepad"></i> Games</a></li>
            <li><a href="/pages/ai/ai.html"><i class="fas fa-robot"></i> AI Chat</a></li>
            <li><a href="/pages/community/community.html"><i class="fas fa-users"></i> Community</a></li>
        </ul>

        <div class="auth-buttons" id="authButtons">
            <a href="/pages/auth/login.html" class="btn btn-outline">Login</a>
            <a href="/pages/auth/register.html" class="btn btn-primary">Register</a>
        </div>

        <div class="user-menu" id="userMenu" style="display:none;">
            <div class="user-avatar" id="userAvatar" onclick="toggleDropdown()">
                <span id="avatarText">U</span>
            </div>
            <div class="user-dropdown" id="userDropdown">
                <a href="/pages/profile/profile.html"><i class="fas fa-user"></i> Profile</a>
                <a href="/admin/index.html" id="adminLink"><i class="fas fa-crown"></i> Admin</a>
                <div class="divider"></div>
                <a href="#" onclick="logoutUser()"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </nav>

    <div class="games-header">
        <h1><i class="fas fa-gamepad"></i> All Games</h1>
        <p>Choose a game and start playing</p>
    </div>

    <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="🔍 Search games..." />
        <span class="filter-count" id="gameCount">0 games</span>
    </div>

    <div class="games-grid" id="gamesContainer">
        <div class="loading"><i class="fas fa-spinner"></i> Loading games...</div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 <a href="/">DVARY GAMES</a>. All rights reserved.</p>
    </footer>

    <div class="toast" id="toast"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, signOut, onAuthStateChanged } from "firebase/auth";
        import { getFirestore, collection, getDocs, query, orderBy } from "firebase/firestore";

        const firebaseConfig = {
            apiKey: "AIzaSyCmwASW4XXQ3O0AvsCM_r1WLlrUmGjYVxI",
            authDomain: "dvary-9a7d0.firebaseapp.com",
            projectId: "dvary-9a7d0",
            storageBucket: "dvary-9a7d0.firebasestorage.app",
            messagingSenderId: "107370806066",
            appId: "1:107370806066:web:4c2ce1e6f7b6c32909f52b",
            measurementId: "G-07361LFJEP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const gamesContainer = document.getElementById('gamesContainer');
        const searchInput = document.getElementById('searchInput');
        const gameCount = document.getElementById('gameCount');
        const authButtons = document.getElementById('authButtons');
        const userMenu = document.getElementById('userMenu');
        const avatarText = document.getElementById('avatarText');
        const toast = document.getElementById('toast');
        let allGames = [];

        function showToast(message, type = 'info') {
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        window.toggleDropdown = function() {
            document.getElementById('userDropdown').classList.toggle('show');
        };

        window.logoutUser = function() {
            signOut(auth).then(() => {
                showToast('Logged out', 'success');
                document.getElementById('userDropdown').classList.remove('show');
            }).catch((error) => {
                showToast('Error: ' + error.message, 'error');
            });
        };

        document.addEventListener('click', function(event) {
            const menu = document.querySelector('.user-menu');
            if (menu && !menu.contains(event.target)) {
                document.getElementById('userDropdown').classList.remove('show');
            }
        });

        function renderGames(games) {
            if (games.length === 0) {
                gamesContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-gamepad"></i>
                        <h3>No Games Found</h3>
                        <p>${searchInput.value ? 'No games match your search.' : 'Admin will add games soon!'}</p>
                    </div>
                `;
                gameCount.textContent = '0 games';
                return;
            }

            let html = '';
            games.forEach((game) => {
                html += `
                    <div class="game-card" onclick="window.location.href='/pages/game-details/game-details.html?id=${game.id}'">
                        <div class="game-card-image">
                            <i class="fas fa-gamepad"></i>
                        </div>
                        <div class="game-card-body">
                            <h3>${game.name || 'Untitled'}</h3>
                            <p>${game.description || 'No description'}</p>
                            <div class="game-meta">
                                <span><i class="far fa-calendar-alt"></i> ${game.date || 'New'}</span>
                                <button class="play-btn">Play</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            gamesContainer.innerHTML = html;
            gameCount.textContent = games.length + ' game' + (games.length > 1 ? 's' : '');
        }

        async function loadGames() {
            try {
                const gamesRef = collection(db, 'games');
                const q = query(gamesRef, orderBy('createdAt', 'desc'));
                const snapshot = await getDocs(q);

                allGames = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    allGames.push({
                        id: doc.id,
                        name: data.name || 'Untitled Game',
                        description: data.description || 'No description available',
                        date: data.createdAt ? new Date(data.createdAt.toDate()).toLocaleDateString() : 'New'
                    });
                });

                renderGames(allGames);

            } catch (error) {
                console.error('Error loading games:', error);
                gamesContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle" style="color:#e94560;"></i>
                        <h3>Error Loading Games</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // Search filter
        searchInput.addEventListener('input', () => {
            const query = searchInput.value.toLowerCase().trim();
            if (!query) {
                renderGames(allGames);
                return;
            }
            const filtered = allGames.filter(game =>
                game.name.toLowerCase().includes(query) ||
                game.description.toLowerCase().includes(query)
            );
            renderGames(filtered);
        });

        // Auth state
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authButtons.style.display = 'none';
                userMenu.style.display = 'block';
                avatarText.textContent = user.email ? user.email.charAt(0).toUpperCase() : 'U';

                const adminLink = document.getElementById('adminLink');
                if (user.email === 'admin@dvary.com') {
                    adminLink.style.display = 'block';
                } else {
                    adminLink.style.display = 'none';
                }
            } else {
                authButtons.style.display = 'flex';
                userMenu.style.display = 'none';
            }
        });

        loadGames();
    </script>

</body>
                              </html>
