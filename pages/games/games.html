    <!-- CSS Link -->

<body>

    <!-- SIDEBAR NAVIGATION -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>DVARY <span>GAMES</span></h2>
        </div>
        <ul class="sidebar-links">
            <li><a href="../../public/index.html"><i class="fa-solid fa-house"></i> <span>Mwanzo</span></a></li>

            <h1>Maktaba ya Michezo</h1>

        <div class="games-grid" id="games-grid-container">

            <div class="game-card">

                    <p>Hii ni maelezo mafupi ya mchezo unaopatikana kwenye mfumo.</p>

    <!-- FLOATING AI BUTTON -->
    <a href="../ai/ai.html" class="floating-ai" title="Uliza AI">

    <!-- FIREBASE SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Usanidi wako wa Firebase (Weka taarifa zako hapa)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Sehemu ya kupachika michezo kutoka Firestore itakaa hapa
        console.log("Firebase imewashwa kwenye ukurasa wa Games!");
    </script>
