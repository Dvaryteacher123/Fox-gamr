<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DVARY GAMES - Login</title>
    
    <!-- Firebase Config -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCmwASW4XXQ3O0AvsCM_r1WLlrUmGjYVxI",
            authDomain: "dvary-9a7d0.firebaseapp.com",
            projectId: "dvary-9a7d0",
            storageBucket: "dvary-9a7d0.firebasestorage.app",
            messagingSenderId: "107370806066",
            appId: "1:107370806066:web:4c2ce1e6f7b6c32909f52b",
            measurementId: "G-07361LFJEP"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.auth = auth;
        window.db = db;
    </script>

    <link rel="stylesheet" href="login.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="login-container">
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <span class="logo-icon">🎮</span>
                    <span class="logo-text">DVARY GAMES</span>
                </div>
                <h2>Welcome Back!</h2>
                <p>Login to continue your gaming journey</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="Enter your email" 
                        required 
                        autocomplete="email"
                    />
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Enter your password" 
                            required 
                            autocomplete="current-password"
                        />
                        <button type="button" id="togglePassword" class="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" checked />
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <div id="errorMessage" class="error-message" style="display:none;">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText">Invalid email or password</span>
                </div>

                <button type="submit" id="loginBtn" class="login-btn">
                    <span id="loginText">Login</span>
                    <span id="loginSpinner" class="spinner" style="display:none;"></span>
                </button>

                <div class="divider">
                    <span>or</span>
                </div>

                <div class="signup-link">
                    <p>Don't have an account? <a href="signup.html">Create Account</a></p>
                </div>
            </form>

            <div class="demo-credentials">
                <p><i class="fas fa-info-circle"></i> Demo Credentials:</p>
                <div class="demo-box">
                    <span><strong>Admin:</strong> admin@dvarygames.com</span>
                    <span><strong>Pass:</strong> Admin@12345</span>
                </div>
                <button id="fillDemoBtn" class="demo-btn">Fill Demo Credentials</button>
            </div>
        </div>

        <div class="login-footer">
            <p>&copy; 2026 DVARY GAMES. All rights reserved.</p>
        </div>
    </div>

    <script type="module">
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const auth = getAuth();
        const db = getFirestore();

        // DOM Elements
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const loginBtn = document.getElementById('loginBtn');
        const loginText = document.getElementById('loginText');
        const loginSpinner = document.getElementById('loginSpinner');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const rememberMe = document.getElementById('rememberMe');
        const fillDemoBtn = document.getElementById('fillDemoBtn');

        // Check if already logged in
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userDoc = await getDoc(doc(db, 'users', user.uid));
                    if (userDoc.exists()) {
                        window.location.href = 'index.html';
                        return;
                    }
                } catch (error) {
                    console.error('Error checking user:', error);
                }
            }
        });

        // Toggle password
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.querySelector('i').className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
        });

        // Fill demo credentials
        fillDemoBtn.addEventListener('click', () => {
            emailInput.value = 'admin@dvarygames.com';
            passwordInput.value = 'Admin@12345';
            rememberMe.checked = true;
        });

        // Login form submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }

            if (!isValidEmail(email)) {
                showError('Please enter a valid email address');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }

            setLoading(true);
            hideError();

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                const userDoc = await getDoc(doc(db, 'users', user.uid));
                
                if (!userDoc.exists()) {
                    await auth.signOut();
                    showError('Account not found. Please contact support.');
                    setLoading(false);
                    return;
                }

                const userData = userDoc.data();

                if (userData.isActive === false) {
                    await auth.signOut();
                    showError('Your account has been blocked.');
                    setLoading(false);
                    return;
                }

                await updateDoc(doc(db, 'users', user.uid), {
                    onlineStatus: true,
                    lastSeen: new Date().toISOString()
                });

                window.location.href = 'index.html';

            } catch (error) {
                console.error('Login error:', error);
                
                let message = 'Login failed. Please try again.';
                
                switch (error.code) {
                    case 'auth/user-not-found':
                        message = 'No account found with this email';
                        break;
                    case 'auth/wrong-password':
                        message = 'Incorrect password. Please try again.';
                        break;
                    case 'auth/invalid-email':
                        message = 'Invalid email format';
                        break;
                    case 'auth/too-many-requests':
                        message = 'Too many failed attempts. Please try again later.';
                        break;
                    case 'auth/user-disabled':
                        message = 'This account has been disabled.';
                        break;
                    case 'auth/network-request-failed':
                        message = 'Network error. Check your internet connection.';
                        break;
                    default:
                        message = error.message || 'Login failed. Please try again.';
                }
                
                showError(message);
                setLoading(false);
            }
        });

        // Helper functions
        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function showError(message) {
            errorMessage.style.display = 'flex';
            errorText.textContent = message;
        }

        function hideError() {
            errorMessage.style.display = 'none';
            errorText.textContent = '';
        }

        function setLoading(loading) {
            if (loading) {
                loginBtn.disabled = true;
                loginText.textContent = 'Logging in...';
                loginSpinner.style.display = 'inline-block';
            } else {
                loginBtn.disabled = false;
                loginText.textContent = 'Login';
                loginSpinner.style.display = 'none';
            }
        }

        console.log('✅ Login page loaded');
    </script>
</body>
</html>
