<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVARY GAMES - AI Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1e293b;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.9rem;
            background: #334155;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 15px;
            border-radius: 10px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #2563eb;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background-color: #1e293b;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #334155;
        }
        .input-container {
            display: flex;
            padding: 15px;
            background-color: #1e293b;
            border-top: 1px solid #334155;
        }
        input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #334155;
            border-radius: 8px;
            background-color: #0f172a;
            color: white;
            outline: none;
            font-size: 1rem;
        }
        input:focus {
            border-color: #38bdf8;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 0 20px;
            margin-left: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .loading {
            font-style: italic;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <header>
        <span>🤖 DVARY GAMES AI</span>
        <a href="/main">Rudi Nyumbani</a>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">Habari! Mimi ni msaidizi wako wa AI wa DVARY GAMES. Unahitaji msaada gani kuhusu michezo au mfumo wetu leo?</div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="Andika ujumbe wako hapa..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Tuma</button>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatContainer = document.getElementById('chatContainer');
            const text = inputField.value.trim();

            if (!text) return;

            // Onyesha ujumbe wa mtumiaji kwenye skrini
            const userMsg = document.createElement('div');
            userMsg.className = 'message user-message';
            userMsg.textContent = text;
            chatContainer.appendChild(userMsg);

            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Weka ujumbe wa "Inasubiri jibu..."
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'message ai-message loading';
            loadingMsg.textContent = 'Anatafuta jibu...';
            chatContainer.appendChild(loadingMsg);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // Tuma ombi kwenye backend mpya ya /api/ai-chat
                const response = await fetch('/api/ai-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();

                // Ondoa ujumbe wa kupakia
                chatContainer.removeChild(loadingMsg);

                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai-message';

                if (data.success && data.response) {
                    aiMsg.textContent = data.response;
                } else {
                    aiMsg.textContent = data.error || 'Samahani, kimetokea kosa la kiufundi.';
                }

                chatContainer.appendChild(aiMsg);
                chatContainer.scrollTop = chatContainer.scrollHeight;

            } catch (error) {
                chatContainer.removeChild(loadingMsg);
                const errorMsg = document.createElement('div');
                errorMsg.className = 'message ai-message';
                errorMsg.textContent = 'Imeshindwa kuunganisha na seva. Angalia mtandao wako.';
                chatContainer.appendChild(errorMsg);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
