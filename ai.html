<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVARY AI - AI Chat Assistant</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>

    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121f;
            --bg-card: rgba(26, 26, 46, 0.7);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --accent-hover: #8b5cf6;
            --border: rgba(255, 255, 255, 0.06);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.06);
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
        }

        [data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.8);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.2);
            --accent-hover: #818cf8;
            --border: rgba(0, 0, 0, 0.06);
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(0, 0, 0, 0.06);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            padding-top: 72px;
            padding-bottom: 80px;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 3px;
        }

        /* ============================================================
           TOP HEADER
           ============================================================ */
        .top-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 12px 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .top-header.scrolled {
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .header-left .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .header-left .logo span {
            color: var(--accent);
        }

        .header-left .logo .icon {
            margin-right: 4px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 6px;
            border-radius: 50%;
            text-decoration: none;
        }

        .header-btn:hover {
            color: var(--text-primary);
            background: var(--glass-bg);
        }

        /* ============================================================
           AI CHAT CONTAINER
           ============================================================ */
        .ai-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px 20px;
            height: calc(100vh - 160px);
            display: flex;
            flex-direction: column;
        }

        /* AI Header */
        .ai-header {
            text-align: center;
            margin-bottom: 25px;
            animation: fadeInDown 0.6s ease;
        }

        .ai-header .ai-icon {
            font-size: 56px;
            display: block;
            margin-bottom: 8px;
            animation: floatAI 3s ease-in-out infinite;
        }

        @keyframes floatAI {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .ai-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .ai-header h1 span {
            color: var(--accent);
        }

        .ai-header p {
            color: var(--text-secondary);
            font-size: 15px;
            margin-top: 4px;
        }

        /* ============================================================
           CHAT MESSAGES
           ============================================================ */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 300px;
            max-height: calc(100vh - 330px);
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        /* Message Styles */
        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.6;
            animation: msgFade 0.4s ease;
            word-wrap: break-word;
        }

        @keyframes msgFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            align-self: flex-start;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 4px;
            color: var(--text-primary);
        }

        .message.bot .msg-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .message.bot .msg-label .dot {
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            display: inline-block;
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.user .msg-label {
            font-size: 11px;
            font-weight: 700;
            opacity: 0.8;
            margin-bottom: 4px;
            text-align: right;
        }

        .message .msg-time {
            font-size: 10px;
            opacity: 0.5;
            margin-top: 6px;
            display: block;
            text-align: right;
        }

        /* Typing Indicator */
        .typing-indicator {
            align-self: flex-start;
            padding: 12px 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            display: none;
            gap: 6px;
            align-items: center;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        /* ============================================================
           CHAT INPUT
           ============================================================ */
        .chat-input-area {
            display: flex;
            gap: 12px;
            padding: 4px 0;
            animation: fadeInUp 0.6s ease;
        }

        .chat-input-area input {
            flex: 1;
            padding: 14px 20px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        .chat-input-area input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .chat-input-area input::placeholder {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .chat-input-area .send-btn {
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .chat-input-area .send-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 40px var(--accent-glow);
        }

        .chat-input-area .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .chat-input-area .send-btn .arrow {
            transition: transform 0.3s ease;
            display: inline-block;
        }

        .chat-input-area .send-btn:hover .arrow {
            transform: translateX(4px);
        }

        /* ============================================================
           SUGGESTION CHIPS
           ============================================================ */
        .suggestion-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            animation: fadeInUp 0.8s ease;
        }

        .suggestion-chips .chip {
            padding: 8px 18px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .suggestion-chips .chip:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        /* ============================================================
           ANIMATIONS
           ============================================================ */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           EMPTY STATE
           ============================================================ */
        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-align: center;
            padding: 40px 20px;
        }

        .empty-chat .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-chat h3 {
            color: var(--text-primary);
            font-size: 20px;
            margin-bottom: 4px;
        }

        .empty-chat p {
            font-size: 14px;
            opacity: 0.7;
            max-width: 400px;
        }

        /* ============================================================
           BOTTOM NAV
           ============================================================ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0 max(8px, env(safe-area-inset-bottom));
            height: 68px;
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            padding: 4px 12px;
            border-radius: 8px;
            min-width: 48px;
        }

        .bottom-nav .nav-item .nav-icon {
            font-size: 22px;
            line-height: 1;
        }

        .bottom-nav .nav-item:hover {
            color: var(--text-primary);
        }

        .bottom-nav .nav-item.active {
            color: var(--accent);
        }

        .bottom-nav .nav-item.active .nav-icon {
            text-shadow: 0 0 20px var(--accent-glow);
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            body {
                padding-top: 64px;
                padding-bottom: 70px;
            }

            .top-header {
                padding: 10px 16px;
            }
            .header-left .logo {
                font-size: 18px;
            }

            .ai-container {
                padding: 20px 16px 16px;
                height: calc(100vh - 140px);
            }

            .ai-header h1 {
                font-size: 22px;
            }
            .ai-header .ai-icon {
                font-size: 44px;
            }

            .chat-messages {
                padding: 16px 12px;
                min-height: 200px;
                max-height: calc(100vh - 300px);
            }

            .message {
                max-width: 92%;
                font-size: 14px;
                padding: 12px 14px;
            }

            .chat-input-area {
                flex-direction: column;
                gap: 10px;
            }

            .chat-input-area .send-btn {
                justify-content: center;
                padding: 12px 20px;
                font-size: 16px;
                width: 100%;
            }

            .suggestion-chips {
                gap: 6px;
            }
            .suggestion-chips .chip {
                font-size: 12px;
                padding: 6px 14px;
            }

            .bottom-nav {
                height: 60px;
                padding: 4px 0 max(4px, env(safe-area-inset-bottom));
            }
            .bottom-nav .nav-item {
                font-size: 9px;
                padding: 2px 8px;
                min-width: 40px;
            }
            .bottom-nav .nav-item .nav-icon {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .ai-header h1 {
                font-size: 20px;
            }
            .ai-header .ai-icon {
                font-size: 38px;
            }

            .message {
                font-size: 13px;
                padding: 10px 12px;
                max-width: 95%;
            }

            .chat-input-area input {
                font-size: 14px;
                padding: 12px 16px;
            }

            .chat-input-area .send-btn {
                font-size: 15px;
                padding: 10px 16px;
            }

            .bottom-nav .nav-item {
                min-width: 32px;
            }
            .bottom-nav .nav-item .nav-icon {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    TOP HEADER
    ============================================================ -->

        <div class="suggestion-chips">
            <span class="chip" onclick="sendSuggestion('What games are available?')">🎮 Available Games</span>

            <span class="chip" onclick="sendSuggestion('VIP games and claims')">⭐ VIP & Claims</span>

        <div class="chat-messages" id="chatMessages">
            <!-- Empty State -->
            <div class="empty-chat" id="emptyChat">

                <p>Ask me anything about games, downloads, VIP claims, or just say hello!</p>
            </div>

            <!-- Typing Indicator -->

    <!-- ============================================================

    <nav class="bottom-nav" id="bottomNav">
        <a href="/main" class="nav-item">

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCnaIWkHEwoWQgjadYLyfVoMWZK0x6toxA",
            authDomain: "enjoy-game-6c05c.firebaseapp.com",
            projectId: "enjoy-game-6c05c",
            storageBucket: "enjoy-game-6c05c.firebasestorage.app",
            messagingSenderId: "512924203714",
            appId: "1:512924203714:web:47b16f7ce1b786a224195b",
            measurementId: "G-Y2H8BYM4LP"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // STATE
        // ============================================================
        let currentUser = null;
        let isProcessing = false;

        // ============================================================
        // AUTH STATE
        // ============================================================
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                console.log('✅ User logged in:', user.email);
            } else {
                console.log('🔒 User not logged in');
                // Show login prompt in chat
                const messages = document.getElementById('chatMessages');
                const empty = document.getElementById('emptyChat');
                if (empty) {
                    empty.innerHTML = `
                        <span class="empty-icon">🔒</span>
                        <h3>Please Login</h3>
                        <p>You need to be logged in to use AI Assistant.</p>
                        <a href="/login" style="display:inline-block;margin-top:12px;padding:10px 30px;background:var(--accent);color:white;border-radius:10px;text-decoration:none;font-weight:600;">🔑 Login</a>
                    `;
                }
            }
        });

        // ============================================================
        // DOM ELEMENTS
        // ============================================================
        const chatMessages = document.getElementById('chatMessages');
        const aiInput = document.getElementById('aiInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const emptyChat = document.getElementById('emptyChat');

        // ============================================================
        // SEND MESSAGE
        // ============================================================
        async function sendMessage() {
            const message = aiInput.value.trim();

            if (!message) {
                aiInput.focus();
                return;
            }

            if (!currentUser) {
                showToast('🔒 Tafadhali login kwanza', 'error');
                return;
            }

            if (isProcessing) return;

            // Clear empty chat
            if (emptyChat) {
                emptyChat.style.display = 'none';
            }

            // Add user message
            addMessage(message, 'user');
            aiInput.value = '';
            aiInput.focus();

            // Show typing indicator
            typingIndicator.classList.add('active');
            chatMessages.scrollTop = chatMessages.scrollHeight;
            isProcessing = true;
            sendBtn.disabled = true;

            try {
                // Get AI response from Firestore or API
                const response = await getAIResponse(message);

                // Remove typing indicator
                typingIndicator.classList.remove('active');

                // Add bot response
                addMessage(response, 'bot');

            } catch (error) {
                console.error('AI Error:', error);
                typingIndicator.classList.remove('active');
                addMessage('❌ Sorry, I am having trouble connecting. Please try again later.', 'bot');
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        // ============================================================
        // GET AI RESPONSE
        // ============================================================
        async function getAIResponse(message) {
            // Try to get response from Firestore AI responses
            try {
                const snapshot = await db.collection('ai_responses')
                    .where('keywords', 'array-contains-any', message.toLowerCase().split(' '))
                    .limit(1)
                    .get();

                if (!snapshot.empty) {
                    return snapshot.docs[0].data().response;
                }
            } catch (error) {
                console.error('Error fetching AI response:', error);
            }

            // Fallback responses based on keywords
            const msg = message.toLowerCase();

            // Game recommendations
            if (msg.includes('game') && (msg.includes('recommend') || msg.includes('suggest') || msg.includes('which'))) {
                return `🎮 Here are some popular games you might enjoy:

• 🏎️ Real Racing 7 - For racing fans
• ⚔️ Shadow Fight - Action packed
• 🧙 Fantasy Quest - Adventure awaits
• 🎯 Sniper Elite - Precision shooting

Which one interests you?`;
            }

            // Download help
            if (msg.includes('download') || msg.includes('how to')) {
                return `⬇️ To download games:

1. Go to the Games page
2. Choose a game you like
3. If it's FREE, click "Download" directly
4. If it's VIP, you need a claim code

Do you have a claim code? I can help you with that!`;
            }

            // VIP and Claims
            if (msg.includes('vip') || msg.includes('claim') || msg.includes('code')) {
                return `⭐ VIP Games & Claims:

• VIP games require a claim code to unlock
• You can get a claim code from Admin
• Go to "Claim" page to use your code
• Once unlocked, you can download the game

Do you have a claim code? I can help you use it!`;
            }

            // Available games
            if (msg.includes('available') || msg.includes('what games') || msg.includes('list')) {
                return `🎮 Available Games:

We have both FREE and VIP games:
• 🆓 Free games - Download directly
• ⭐ VIP games - Need claim code

Visit the Games page to see all available games!`;
            }

            // Greetings
            if (msg.includes('hello') || msg.includes('hi') || msg.includes('hey')) {
                return `👋 Hello there! Welcome to DVARY GAMES AI Assistant.

I'm here to help you with:
• Finding games 🎮
• Downloading games ⬇️
• VIP claims and codes ⭐
• Game recommendations 🎯

What would you like to know?`;
            }

            // Default responses
            const responses = [
                `🤔 That's an interesting question! Let me think about it...

In the meantime, you can:
• Browse games in the Games section
• Check your claims in the Claim section
• Visit About page to learn more

Is there anything specific you'd like to know?`,
                `💡 I'm not sure about that yet. But I can help you with:

• Finding games to play
• Downloading games
• VIP claims and codes
• Game recommendations

What would you like to know more about?`,
                `🤖 I'm still learning! But here's what I know:

• DVARY GAMES has both FREE and VIP games
• VIP games need a claim code
• You can download games after unlocking
• Check the Games page for all titles

Can I help you with something specific?`
            ];

            return responses[Math.floor(Math.random() * responses.length)];
        }

        // ============================================================
        // ADD MESSAGE TO CHAT
        // ============================================================
        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const label = sender === 'bot' ? '🤖 DVARY AI' : '👤 You';

            messageDiv.innerHTML = `
                <div class="msg-label">${label} ${sender === 'bot' ? '<span class="dot"></span>' : ''}</div>
                ${text.replace(/\n/g, '<br>')}
                <span class="msg-time">${time}</span>
            `;

            // Remove empty chat if exists
            const empty = document.getElementById('emptyChat');
            if (empty) {
                empty.style.display = 'none';
            }

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ============================================================
        // SEND SUGGESTION
        // ============================================================
        function sendSuggestion(text) {
            aiInput.value = text;
            sendMessage();
        }

        // ============================================================
        // SHOW TOAST
        // ============================================================
        function showToast(message, type = 'info') {
            const existing = document.querySelector('.custom-toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `custom-toast notification-toast ${type}`;
            toast.innerHTML = `
                ${message}
                <button class="close-btn" onclick="this.parentElement.remove()">×</button>
            `;
            document.body.appendChild(toast);

            setTimeout(() => {
                if (toast.parentElement) toast.remove();
            }, 5000);
        }

        // ============================================================
        // ENTER KEY SUPPORT
        // ============================================================
        aiInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        // ============================================================
        // HEADER SCROLL
        // ============================================================
        window.addEventListener('scroll', () => {
            const header = document.getElementById('topHeader');
            if (window.scrollY > 10) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // ============================================================
        // FOCUS INPUT ON LOAD
        // ============================================================
        window.addEventListener('load', () => {
            setTimeout(() => {
                aiInput.focus();
            }, 500);
        });

        console.log('🤖 DVARY AI Chat loaded!');
        console.log('💬 Ask me anything about games, downloads, VIP claims, and more!');
    </script>

    <!-- ============================================================
    TOAST STYLES (Inline for dynamic toast)
    ============================================================ -->
    <style>
        .custom-toast {
            position: fixed;
            top: 80px;
            right: 20px;
            padding: 14px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            animation: slideIn 0.4s ease;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .custom-toast.success { background: var(--success); }
        .custom-toast.error { background: var(--danger); }
        .custom-toast.info { background: var(--accent); }
        .custom-toast.warning { background: var(--warning); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .custom-toast .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            opacity: 0.7;
            padding: 0 4px;
        }

        .custom-toast .close-btn:hover { opacity: 1; }
    </style>

</body>
  </html>
