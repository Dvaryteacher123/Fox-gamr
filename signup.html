<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVARY GAMES - Sign Up</title>
    
    <!-- Firebase SDK (Zilizorekebishwa na Kuongezwa ya Storage) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #1a1a2e;
            --bg-card: #1a1a2e;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #8b5cf6;
            --border: #2d2d44;
            --shadow: rgba(99, 102, 241, 0.2);
            --success: #22c55e;
            --danger: #ef4444;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .signup-container {
            background: var(--bg-card);
            padding: 50px;
            border-radius: 20px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 420px;
            animation: slideUp 0.5s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .signup-container .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .signup-container .logo h2 {
            font-size: 32px;
            color: var(--accent);
        }
        
        .signup-container .logo p {
            color: var(--text-secondary);
            margin-top: 5px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group label .required {
            color: var(--danger);
            margin-left: 2px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            border-color: var(--accent);
        }
        
        .password-wrapper {
            position: relative;
        }
        
        .password-wrapper input {
            padding-right: 48px;
        }
        
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 20px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .password-requirements {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 6px;
        }
        
        .password-requirements .valid {
            color: var(--success);
        }
        
        .password-requirements .invalid {
            color: var(--danger);
        }
        
        .signup-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .signup-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
        }
        
        .signup-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .login-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            color: var(--danger);
            font-size: 14px;
            margin-top: 10px;
            display: none;
            padding: 10px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            color: var(--success);
            font-size: 14px;
            margin-top: 10px;
            display: none;
            padding: 10px;
            background: rgba(34, 197, 94, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
        
        .success-message.show {
            display: block;
        }
        
        .profile-picture-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .profile-picture-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--accent);
            cursor: pointer;
            background: var(--bg-primary);
        }
        
        .profile-picture-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .profile-picture-wrapper .placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: var(--text-secondary);
        }
        
        .profile-picture-wrapper .upload-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            color: white;
            font-size: 14px;
            font-weight: 600;
        }
        
        .profile-picture-wrapper:hover .upload-overlay {
            opacity: 1;
        }
        
        .profile-picture-wrapper .remove-photo {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 28px;
            height: 28px;
            background: var(--danger);
            border-radius: 50%;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }
        
        .profile-picture-wrapper .remove-photo.show {
            display: flex;
        }
        
        .upload-progress {
            display: none;
            margin-top: 8px;
            width: 100%;
            max-width: 200px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .upload-progress.active {
            display: block;
        }
        
        .upload-progress .bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        #profileImageInput {
            display: none;
        }
        
        .already-logged {
            text-align: center;
            padding: 20px;
            background: var(--bg-primary);
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .already-logged p {
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        
        .already-logged .email-display {
            color: var(--accent);
            font-weight: 600;
        }
        
        .already-logged .btn-logout {
            padding: 10px 30px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    
    <div class="signup-container">
        <div class="logo">
            <h2>📝 Create Account</h2>
            <p>Join DVARY GAMES today!</p>
        </div>
        
        <div class="profile-picture-section">
            <div class="profile-picture-wrapper" id="profilePictureWrapper" onclick="document.getElementById('profileImageInput').click()">
                <div class="placeholder" id="profilePlaceholder">👤</div>
                <img id="profilePreview" style="display: none;" alt="Profile" />
                <div class="upload-overlay">📷 Upload</div>
                <button class="remove-photo" id="removePhoto" onclick="event.stopPropagation(); removePhoto()">✕</button>
            </div>
            <span style="color: var(--text-secondary); font-size: 12px; margin-top: 8px;">Click to upload profile picture (optional)</span>
            <div class="upload-progress" id="uploadProgress">
                <div class="bar" id="uploadBar"></div>
            </div>
            <input type="file" id="profileImageInput" accept="image/*" />
        </div>
        
        <form id="signupForm">
            <div class="form-group">
                <label>Username <span class="required">*</span></label>
                <input type="text" id="username" placeholder="Choose a username" required />
            </div>
            
            <div class="form-group">
                <label>Email Address <span class="required">*</span></label>
                <input type="email" id="email" placeholder="you@example.com" required />
            </div>
            
            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Min 6 characters" required />
                    <button type="button" class="password-toggle" id="passwordToggle">👁️</button>
                </div>
                <div class="password-requirements">
                    <span id="lengthReq" class="invalid">❌ At least 6 characters</span>
                </div>
            </div>
            
            <div class="form-group">
                <label>Confirm Password <span class="required">*</span></label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Re-enter password" required />
                    <button type="button" class="password-toggle" id="confirmPasswordToggle">👁️</button>
                </div>
            </div>
            
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            
            <button type="submit" class="signup-btn" id="signupBtn">Create Account</button>
        </form>
        
        <div class="login-link">
            Already have an account? <a href="/login">Sign in</a>
        </div>
        
        <div id="alreadyLogged" style="display: none;" class="already-logged">
            <p>You are already signed in as</p>
            <p class="email-display" id="loggedEmail"></p>
            <button class="btn-logout" onclick="logout()">Sign Out</button>
        </div>
    </div>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCnaIWkHEwoWQgjadYLyfVoMWZK0x6toxA",
            authDomain: "enjoy-game-6c05c.firebaseapp.com",
            projectId: "enjoy-game-6c05c",
            storageBucket: "enjoy-game-6c05c.firebasestorage.app",
            messagingSenderId: "512924203714",
            appId: "1:512924203714:web:47b16f7ce1b786a224195b"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();
        
        const signupForm = document.getElementById('signupForm');
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const signupBtn = document.getElementById('signupBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const alreadyLogged = document.getElementById('alreadyLogged');
        const loggedEmail = document.getElementById('loggedEmail');
        const lengthReq = document.getElementById('lengthReq');
        
        const profileImageInput = document.getElementById('profileImageInput');
        const profilePreview = document.getElementById('profilePreview');
        const profilePlaceholder = document.getElementById('profilePlaceholder');
        const removePhotoBtn = document.getElementById('removePhoto');
        const uploadProgress = document.getElementById('uploadProgress');
        const uploadBar = document.getElementById('uploadBar');
        
        let selectedFile = null;
        
        auth.onAuthStateChanged((user) => {
            if (user) {
                signupForm.style.display = 'none';
                alreadyLogged.style.display = 'block';
                loggedEmail.textContent = user.email;
            } else {
                signupForm.style.display = 'block';
                alreadyLogged.style.display = 'none';
            }
        });
        
        function logout() {
            auth.signOut().then(() => {
                window.location.reload();
            });
        }
        
        profileImageInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (!file) return;
            selectedFile = file;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                profilePreview.src = e.target.result;
                profilePreview.style.display = 'block';
                profilePlaceholder.style.display = 'none';
                removePhotoBtn.classList.add('show');
            };
            reader.readAsDataURL(file);
        });
        
        function removePhoto() {
            selectedFile = null;
            profilePreview.style.display = 'none';
            profilePlaceholder.style.display = 'flex';
            removePhotoBtn.classList.remove('show');
            profileImageInput.value = '';
        }
        
        document.getElementById('passwordToggle').addEventListener('click', function() {
            passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
            this.textContent = passwordInput.type === 'password' ? '👁️' : '🙈';
        });
        
        document.getElementById('confirmPasswordToggle').addEventListener('click', function() {
            confirmInput.type = confirmInput.type === 'password' ? 'text' : 'password';
            this.textContent = confirmInput.type === 'password' ? '👁️' : '🙈';
        });
        
        passwordInput.addEventListener('input', function() {
            if (this.value.length >= 6) {
                lengthReq.innerHTML = '✅ At least 6 characters';
                lengthReq.className = 'valid';
            } else {
                lengthReq.innerHTML = '❌ At least 6 characters';
                lengthReq.className = 'invalid';
            }
        });
        
        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.className = 'error-message show';
            successMessage.className = 'success-message';
        }
        
        function showSuccess(msg) {
            successMessage.textContent = msg;
            successMessage.className = 'success-message show';
            errorMessage.className = 'error-message';
        }
        
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = usernameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirm = confirmInput.value;
            
            if (!username || !email || !password || !confirm) {
                showError('Tafadhali jaza sehemu zote zilizo wazi.');
                return;
            }
            
            if (password.length < 6) {
                showError('Nenosiri linapaswa kuwa na angalau herufi 6.');
                return;
            }
            
            if (password !== confirm) {
                showError('Manenosiri hayafanani.');
                return;
            }
            
            signupBtn.disabled = true;
            signupBtn.textContent = 'Inatengeneza akaunti...';
            
            try {
                const userCred = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCred.user;
                
                let photoURL = null;
                if (selectedFile) {
                    uploadProgress.classList.add('active');
                    const storageRef = storage.ref(`profile_pictures/${user.uid}`);
                    const uploadTask = await storageRef.put(selectedFile);
                    photoURL = await uploadTask.ref.getDownloadURL();
                    uploadProgress.classList.remove('active');
                }
                
                await user.updateProfile({
                    displayName: username,
                    photoURL: photoURL
                });
                
                await db.collection('users').doc(user.uid).set({
                    uid: user.uid,
                    username: username,
                    email: user.email,
                    displayName: username,
                    photoURL: photoURL || null,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    role: 'user'
                });
                
                showSuccess('✅ Akaunti imetengenezwa kikamilifu! Inakupeleka...');
                
                setTimeout(() => {
                    window.location.href = '/main';
                }, 1500);
                
            } catch (error) {
                console.error(error);
                let msg = error.message;
                if (error.code === 'auth/email-already-in-use') msg = 'Barua pepe hii tayari imesajiliwa.';
                showError('❌ ' + msg);
            } finally {
                signupBtn.disabled = false;
                signupBtn.textContent = 'Create Account';
            }
        });
    </script>
</body>
</html>
